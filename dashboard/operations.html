<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wait, How? · สถานะการผลิต</title>
<style>
:root{--bg:#080b1b;--line:#2d3563;--ink:#f4f6ff;--muted:#a8afd1;--aqua:#50e8ff;--good:#6df2b2;--bad:#ff8098}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#2a155c 0,transparent 34%),var(--bg);color:var(--ink);font:16px/1.55 system-ui}main{max-width:1080px;margin:auto;padding:32px 18px 64px}.back{color:var(--aqua);text-decoration:none}.eyebrow{color:var(--aqua);font-weight:800;font-size:.76rem;letter-spacing:.12em;margin-top:30px}h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1;margin:9px 0}.lead,.note,small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.card{background:linear-gradient(145deg,#171c3a,#0e1228);border:1px solid var(--line);border-radius:16px;padding:18px}.value{font-size:2rem;font-weight:800;color:var(--aqua)}h2{font-size:1.1rem;margin:0 0 10px}.section{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:.76rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:34px 0 12px}.section:after{content:'';height:1px;flex:1;background:var(--line)}.item{border-top:1px solid var(--line);padding:14px 0}.item:first-child{border-top:0}.good{color:var(--good)}.bad{color:var(--bad)}a.run{color:var(--aqua);margin-left:8px}.empty{padding:18px;color:var(--muted);border:1px dashed var(--line);border-radius:12px}@media(max-width:750px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.grid{grid-template-columns:1fr}}
</style></head><body><main>
<a class="back" href="/observatory">← ข้อมูลเพิ่มเติม</a><div class="eyebrow">VERIFIABLE PRODUCTION BOARD</div><h1 id="title">กำลังอ่านสถานะ…</h1><p class="lead" id="purpose"></p>
<section class="grid" id="metrics"></section>
<div class="section">คลังหลักฐานล่วงหน้า</div><section class="card" id="evidence"></section>
<div class="section">คลิปพร้อมปล่อย</div><section class="card" id="ready"></section>
<div class="section">กำลังผลิตตอนนี้</div><section class="card" id="active"></section>
<div class="section">สิ่งที่ขวางการปล่อย</div><section class="card" id="blockers"></section>
<div class="section">ระบบอัตโนมัติ</div><section class="card" id="automation"></section>
<p class="note" id="boundary"></p>
<script>
const e=id=>document.getElementById(id),esc=x=>{const d=document.createElement('div');d.textContent=x??'';return d.innerHTML},time=x=>x?new Date(x).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'}):'ไม่มีเวลา',age=x=>x?`${Math.max(0,Math.round((Date.now()-new Date(x))/3600000))} ชม.`:'ไม่ทราบ';
const item=(title,detail,run)=>`<div class="item"><b>${esc(title)}</b>${run?` <a class="run" target="_blank" rel="noopener" href="${esc(run)}">ตรวจรอบทำงาน</a>`:''}<small>${esc(detail||'ไม่มีรายละเอียด')}</small></div>`;
fetch('/api/operations',{cache:'no-store'}).then(r=>r.json()).then(d=>{const p=d.production_control||{},b=p.shorts_buffer||{},reserve=p.evidence_reserve||{},rc=reserve.counts||{},rt=reserve.targets||{},expansion=reserve.content_expansion||{},read=d.release_readiness||{},delivery=d.delivery_status||{},workflow=d.workflow_status||{},episodes=p.episodes||[],ready=episodes.filter(x=>x.release_ready),active=d.active_episodes||[],blockers=d.blockers||[];e('title').textContent=d.title;e('purpose').textContent=d.purpose;e('boundary').textContent=d.boundary;e('metrics').innerHTML=`<article class="card"><h2>พร้อมปล่อย</h2><div class="value">${esc(b.quality_ready??0)}/${esc(b.target??7)}</div><small>นับเฉพาะผ่าน Quality Gate</small></article><article class="card"><h2>หลักฐานผ่าน</h2><div class="value">${esc(rc.qualified_evidence??0)}/${esc(rt.qualified_evidence??14)}</div><small>ต้องมี 2 แหล่งอิสระ</small></article><article class="card"><h2>กำลังผลิต</h2><div class="value">${active.length}</div><small>ไม่รวมงานเก่าหรือเลิกใช้</small></article><article class="card"><h2>ติดขวาง</h2><div class="value">${blockers.length}</div><small>เฉพาะงานที่กำลังผลิต</small></article><article class="card"><h2>Workflow</h2><div class="value">${esc(workflow.tiles?.ok??0)}/${esc(workflow.tiles?.total??0)}</div><small>${esc(workflow.tiles?.running??0)} กำลังทำงาน · ${esc(workflow.tiles?.attn??0)} ต้องดู</small></article>`;e('evidence').innerHTML=item('หัวข้อวิจัย',`${esc(rc.questions??0)}/${esc(rt.questions??21)} กำลังเปิดอยู่`)+item('หลักฐานที่ผ่าน',`${esc(rc.qualified_evidence??0)}/${esc(rt.qualified_evidence??14)} ชุด`)+item('เรื่องพร้อมเขียนบท',`${esc(rc.story_briefs??0)}/${esc(rt.story_briefs??10)} เรื่อง`)+item('แผนแตกเรื่อง',`${esc(expansion.source_packages??0)} ชุดหลักฐาน · ${esc(expansion.planned_follow_ups??0)} มุมต่อยอด`)+item('ขั้นตอนถัดไป',reserve.next_action||'กำลังอ่านรายงาน')+`<p class="note">${esc(reserve.boundary||'')}</p>`;e('ready').innerHTML=ready.length?ready.map(x=>item(x.title,`ผ่านแล้ว · ${x.scene_count||'—'} ฉาก`)).join(''):`<div class="empty">ยังไม่มี Short ที่ผ่าน Quality Gate และรอปล่อย</div>`;e('active').innerHTML=active.length?active.map(x=>item(x.title,`${x.status} · ${x.scene_count||'—'} ฉาก · อัปเดตเมื่อ ${age(x.updated_at)} · สไตล์ ${x.style||'ไม่ระบุ'}`)).join(''):`<div class="empty">ไม่มีตอนใหม่อยู่ในขั้นผลิต ณ เวลาในรายงานล่าสุด</div>`;e('blockers').innerHTML=blockers.length?blockers.map(x=>item(x.title,(x.release_blockers||[x.status]).join(' · '))).join(''):`<div class="empty">ไม่มีงานผลิตที่ติดขวาง</div>`;const release=`คลังขาด ${b.missing??'—'} ตอน · รายงานล่าสุด ${time(read.generated_at)}`;const platforms=(delivery.platforms||[]).map(x=>`${x.platform}: ${x.label||x.state}`).join(' · ');const watch=(workflow.groups||[]).flatMap(g=>g.items||[]).filter(x=>x.status_class!=='success').slice(0,6);e('automation').innerHTML=item('Release readiness',release)+item('หลักฐานการเผยแพร่',platforms||'ยังไม่มีรายงาน')+(watch.length?watch.map(x=>item(x.name,`${x.status_label} · ${time(x.created_at)}`,x.html_url)).join(''):`<div class="item good"><b>Workflow ที่รายงานอยู่ทั้งหมดเป็นปกติหรือกำลังทำงาน</b><small>ตรวจจากสถานะล่าสุด ${time(workflow.generated_at)}</small></div>`);}).catch(()=>{e('title').textContent='อ่านสถานะไม่ได้';e('purpose').textContent='Dashboard ไม่แสดงค่าคาดเดาเมื่อรายงานแหล่งข้อมูลอ่านไม่ได้';});
</script></main></body></html>
