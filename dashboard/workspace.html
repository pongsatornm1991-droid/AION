<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AION Workspace</title><style>
body.learning{background:radial-gradient(circle at 85% 0,rgba(62,221,167,.38),transparent 36%),radial-gradient(circle at 5% 92%,rgba(16,110,88,.35),transparent 42%),linear-gradient(135deg,#031e1d,#072821 50%,#06141c)}body.cyber{background:radial-gradient(circle at 85% 0,rgba(69,125,255,.4),transparent 38%),radial-gradient(circle at 5% 92%,rgba(24,63,155,.34),transparent 43%),linear-gradient(135deg,#07133a,#081c45 52%,#050d22)}body.lab{background:radial-gradient(circle at 84% 0,rgba(255,114,76,.42),transparent 38%),radial-gradient(circle at 5% 92%,rgba(150,38,93,.36),transparent 44%),linear-gradient(135deg,#27101c,#351323 52%,#140b1e)}body.operations{background:radial-gradient(circle at 85% 0,rgba(183,92,255,.42),transparent 38%),radial-gradient(circle at 5% 92%,rgba(55,53,166,.35),transparent 43%),linear-gradient(135deg,#160f2e,#221542 52%,#0c1028)}
:root{--bg:#07121c;--line:#22536d;--ink:#e9f7ff;--muted:#94b5c7;--accent:#45e4f5;--good:#59e5a4;--warn:#ffc75d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 84% 0,var(--glow,rgba(69,228,245,.18)),transparent 34%),var(--bg);color:var(--ink);font:15px/1.55 system-ui}body.learning{--accent:#46d7a9;--glow:rgba(70,215,169,.18)}body.cyber{--accent:#5196ff;--glow:rgba(81,150,255,.18)}body.lab{--accent:#ff9b5e;--glow:rgba(255,155,94,.18)}body.operations{--accent:#c78aff;--glow:rgba(199,138,255,.2)}main{max-width:1160px;margin:auto;padding:38px 22px 68px}.back{color:var(--accent);text-decoration:none}.eyebrow{color:var(--accent);font-size:.75rem;letter-spacing:.13em;margin-top:32px;font-weight:800}h1{font-size:clamp(2.3rem,5vw,4rem);line-height:1;margin:9px 0}.lead,.note{color:var(--muted)}.jumpbar{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.jump{color:var(--ink);text-decoration:none;border:1px solid var(--accent);border-radius:999px;padding:7px 11px;font-size:.76rem;background:color-mix(in srgb,var(--accent) 10%,transparent)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}.card{background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 10%,#102b3d),#0a1c29);border:1px solid var(--line);border-radius:18px;padding:18px}.card h2{font-size:1rem;margin:0 0 8px}.value{font-size:1.8rem;font-weight:800;color:var(--accent)}.section{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:.75rem;letter-spacing:.12em;font-weight:800;text-transform:uppercase;margin:34px 0 12px}.section:after{content:"";height:1px;flex:1;background:var(--line)}.details{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.check{border-top:1px solid var(--line);padding:13px 0}.check:first-child{border-top:0}.pass{color:var(--good)}.attention{color:var(--warn)}.pill{display:inline-block;border:1px solid var(--accent);color:var(--accent);border-radius:99px;padding:3px 8px;font-size:.72rem}.source{display:block;color:var(--ink);text-decoration:none;border-top:1px solid var(--line);padding:13px 0}.source:first-child{border-top:0}.source:hover{color:var(--accent)}.source small,.item small{display:block;color:var(--muted);margin-top:4px}.item{border-top:1px solid var(--line);padding:12px 0}.item:first-child{border-top:0}.role{border-left:3px solid var(--accent);padding:9px 12px;background:rgba(255,255,255,.025);margin:8px 0}.boundary{border-color:color-mix(in srgb,var(--warn) 65%,var(--line));color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.details{grid-template-columns:1fr}}@media(max-width:500px){main{padding:26px 15px}.grid{grid-template-columns:1fr}}
</style></head><body><main><a class="back" href="/">← ศูนย์สังเกตการณ์</a><div class="eyebrow" id="kind">AION WORKSPACE</div><h1 id="title">กำลังเชื่อมต่อ…</h1><p class="lead" id="purpose"></p><nav class="jumpbar"><a class="jump" href="#live">ข้อมูลปัจจุบัน</a><a class="jump" href="#evidence">หลักฐานและรายละเอียด</a><a class="jump" href="#boundary">ขอบเขตห้อง</a></nav><section class="grid" id="metrics"></section><div class="section" id="live">การทำงานจริงในห้องนี้</div><section class="details"><article class="card" id="primary"></article><article class="card" id="secondary"></article></section><div class="section" id="evidence">หลักฐานที่กดตรวจได้</div><section class="card" id="evidenceList"></section><p class="card boundary" id="boundary"></p></main><script>
const route={"/learning":{api:"/api/learning-lab",kind:"LEARNING LAB",body:"learning"},"/cyber":{api:"/api/cyber-guard",kind:"CYBER GUARD",body:"cyber"},"/lab":{api:"/api/evolution-lab",kind:"EVOLUTION & SCIENCE LAB",body:"lab"},"/operations":{api:"/api/operations",kind:"COMPANY OPERATIONS CENTER",body:"operations"}}[location.pathname]||{api:"/api/learning-lab",kind:"LEARNING LAB",body:"learning"};document.body.className=route.body;const e=id=>document.getElementById(id),esc=x=>{const d=document.createElement('div');d.textContent=x??'';return d.innerHTML},state=x=>x==='pass'||x==='healthy'||x==='success'?'pass':x==='attention'||x==='needs-attention'||x==='failure'||x==='partial'?'attention':'';const card=(k,v)=>`<article class="card"><h2>${esc(k)}</h2><div class="value">${esc(v)}</div></article>`,check=x=>`<div class="check"><b class="${state(x.state)}">${esc(x.name||x.title)} · ${esc(x.state||'พร้อม')}</b><br><span class="note">${esc(x.detail||'')}</span></div>`;
function renderLearning(d){const m=d.mind||{},r=d.research||{},c=r.current;e('metrics').innerHTML=card('คำถาม',m.questions||0)+card('บทเรียน',m.lessons||0)+card('ความเชื่อที่ตรวจได้',m.beliefs||0)+card('ค้นพบจากยูทูบ',m.youtube_discoveries||0);e('primary').innerHTML=c?`<h2>Research brief ที่กำลังส่งต่อ</h2><p>${esc(c.topic)}</p><span class="pill">${esc(c.source_count)} แหล่งอ้างอิง</span><p class="note">สิ่งที่ยังไม่แน่ใจ: ${esc(c.unknown_facts)}</p>`:'<h2>ยังไม่มี Research brief</h2><p class="note">ห้องนี้จะรับเฉพาะคำถามที่ตรวจหลักฐานได้</p>';e('secondary').innerHTML=`<h2>หน้าที่ของห้อง</h2><p>เปลี่ยนคำถามเป็นหลักฐานและบทเรียน ก่อนส่งต่อให้ฝ่ายเรื่องเล่า ไม่เผยแพร่หรือสร้างภาพเอง</p><span class="pill">${esc(r.status||'พร้อมรับงาน')}</span>`;const sources=c?.sources||[];const yt=(d.details?.youtube_discoveries?.entries||[]).flatMap(x=>(x.links||[]).map(url=>({title:x.content,url,kind:'สิ่งที่พบจากยูทูบ'})));e('evidenceList').innerHTML=[...sources.map(x=>({title:x.title,url:x.url,kind:x.source_kind,note:x.observation})),...yt].map(x=>`<a class="source" href="${esc(x.url)}" target="_blank" rel="noopener"><b>${esc(x.title)}</b><small>${esc(x.kind)}${x.note?' · '+esc(x.note):''}</small></a>`).join('')||'<p class="note">ยังไม่มีแหล่งที่เปิดตรวจได้</p>'}
function renderCyber(d){const g=d.guard||{},q=d.quality||{},checks=g.checks||[],quality=q.checks||[];e('metrics').innerHTML=card('สถานะ Cyber Guard',g.status||'unknown')+card('ตรวจผ่าน',checks.filter(x=>x.state==='pass').length)+card('ต้องติดตาม',quality.filter(x=>x.state==='attention').length)+card('คุณภาพบริษัท',q.status||'unknown');e('primary').innerHTML=`<h2>การตรวจป้องกัน</h2>${checks.map(check).join('')||'<p class="note">ยังไม่มีผลตรวจ</p>'}`;e('secondary').innerHTML=`<h2>คุณภาพการเชื่อมงาน</h2><p class="note">${esc(q.summary||'')}</p>${quality.map(check).join('')}`;e('evidenceList').innerHTML=`<div class="item"><b>สิ่งที่ห้องนี้ทำได้จริง</b><small>อ่านสถานะระบบ ตรวจไฟล์แกนกลาง และรายงานความเสี่ยงโดยไม่แตะรหัสหรือสิทธิ์บัญชี</small></div><div class="item"><b>ข้อจำกัดที่ตั้งใจไว้</b><small>${esc(q.limitations||'')}</small></div>`}
function renderLab(d){const l=d.lab||{},s=l.science||{},items=l.proposal_items||[];e('metrics').innerHTML=card('ข้อเสนอพัฒนา',l.proposals||0)+card('รอบทบทวน',l.reviews||0)+card('การทดลอง',l.experiments||0)+card('โปรโตคอลวิทยาศาสตร์',s.protocols||0);e('primary').innerHTML=`<h2>วงจรวิวัฒนาการ</h2><p>${esc(l.purpose||'')}</p><span class="pill">${esc(l.status||'พร้อม')}</span><p class="note">ข้อเสนอด้านคอนเทนต์และกระบวนการที่วัดผลได้ จะเข้าสู่การทดลองอัตโนมัติ ไม่ต้องรอปุ่มอนุมัติ</p>`;e('secondary').innerHTML=`<h2>ทีมวิทยาศาสตร์</h2>${(s.roles||[]).map(x=>`<div class="role">${esc(x)}</div>`).join('')||'<p class="note">กำลังจัดทีม</p>'}`;const proposals=items.map(x=>{const p=x.experiment||{};return `<details class="item"><summary><b class="${state(x.state)}">${esc(x.status_label)}</b> · ${esc(x.title)}</summary><small>${esc(x.detail)}</small>${p.method?`<small><b>วิธีทดลอง:</b> ${esc(p.method)}</small><small><b>สัญญาณสำเร็จ:</b> ${esc(p.success_signal)}</small><small><b>หยุดเมื่อ:</b> ${esc(p.stop_rule)}</small>`:''}<small><b>การดำเนินการ:</b> ${esc(x.auto_action)}</small><small class="note">${esc(x.boundary)}</small></details>`}).join('');e('evidenceList').innerHTML=`<div class="item"><b>ข้อเสนอพัฒนาที่กดอ่านได้</b><small>แต่ละรายการแสดงเหตุผล แผนทดลอง เกณฑ์สำเร็จ และสถานะปัจจุบัน</small></div>${proposals||'<p class="note">ยังไม่มีข้อเสนอพัฒนาที่บันทึกไว้</p>'}<div class="item"><b>งานค้างใน Science Lab</b><small>${esc(s.queued||0)} รายการ · ${esc(s.purpose||'')}</small></div><div class="item"><b>หลักการตรวจซ้ำ</b><small>${esc(s.boundary||'')}</small></div>`}
function renderOperations(d){const m=d.metrics||{},q=d.quality||{},departments=d.departments||[],c=d.control||{},work=c.work_now||[],queue=c.work_queue||{},cards=queue.active||[],blocks=c.blockers||[],pre=c.preflight||[],timing=c.audio_timing||[],continuity=c.continuity||{},audience=c.audience||{},repair=c.self_repair||{},context=c.execution_context||{},local=context.local_observer||{},github=context.github_automation||{};const urgent=[...blocks,...timing.filter(x=>x.state==='attention')];e('metrics').innerHTML=card('ฝ่ายที่ตรวจได้',m.departments||0)+card('กำลังเดินงาน',cards.length||m.active||0)+card('เรื่องต้องแก้',urgent.length)+card('Studio',m.studio_stage||'unknown');e('primary').innerHTML=`<h2>วันนี้บริษัทกำลังทำอะไร</h2><p class="note">งานด่วนมาก่อน · งานที่ค้างจะเดินต่อจากบัตรเดิม</p>${cards.slice(0,3).map(x=>`<div class="item"><b>${esc(x.title)}</b><small>${esc(x.priority==='urgent'?'ด่วน':'ปกติ')} · ${esc(x.lane)} · เจ้าของ: ${esc(x.owner)} → ${esc(x.next_owner)}</small><small class="${state(x.status==='blocked'?'attention':'active')}">${esc(x.detail||x.status)}</small></div>`).join('')||work.slice(0,3).map(x=>`<div class="item"><b>${esc(x.name)}</b><small>${esc(x.detail)}</small><small class="${state(x.state)}">${esc(x.recovery)}</small></div>`).join('')||'<p class="note">ไม่มีคิวที่ต้องรอการดำเนินการ</p>'}${cards.length>3?`<details><summary>ดูบัตรงานที่เหลือ ${cards.length-3} รายการ</summary>${cards.slice(3).map(x=>`<div class="item"><b>${esc(x.title)}</b><small>${esc(x.priority==='urgent'?'ด่วน':'ปกติ')} · ${esc(x.lane)} · ${esc(x.owner)} → ${esc(x.next_owner)} · ${esc(x.status)}</small></div>`).join('')}</details>`:''}`;e('secondary').innerHTML=`<h2>ก่อนเผยแพร่ ตรวจอะไรแล้ว</h2><p class="note"><b class="${state(c.quality_gate?.state)}">${esc(c.quality_gate?.label||q.summary||'')}</b><br>${esc(c.quality_gate?.detail||'')}</p>${urgent.slice(0,3).map(x=>`<div class="check"><b class="${state(x.state)}">${esc(x.name||x.title||'รายการตรวจ')}</b><br><span class="note">${esc(x.detail||'')}</span></div>`).join('')||'<p class="note">ไม่พบเรื่องที่ต้องแก้จากหลักฐานล่าสุด</p>'}<details><summary>ดูผลตรวจเสียงและคิวเผยแพร่ทั้งหมด</summary>${[...pre,...timing].map(x=>`<div class="check"><b class="${state(x.state)}">${esc(x.title||'ตรวจคุณภาพ')}</b><br><span class="note">${esc(x.detail||'')}</span></div>`).join('')||'<p class="note">ยังไม่มีผลตรวจเพิ่มเติม</p>'}</details>`;e('evidenceList').innerHTML=`<div class="item"><b>${esc(local.label||'เครื่องนี้')}</b><small>${esc(local.detail||'')}</small>${((local.preflight||{}).checks||[]).map(x=>`<small>${esc(x.platform)} · ${esc(x.configured?'พร้อมใช้เฉพาะเครื่องนี้':'ไม่มีคีย์ในเครื่องนี้')}</small>`).join('')}<small>ไม่มีการแสดง key และข้อมูลนี้ไม่ใช่สถานะ GitHub</small></div><div class="item"><b class="${github.generated_at?'pass':'attention'}">${esc(github.label||'GitHub automation')}</b><small>${esc(github.detail||'')}</small><small>บันทึกล่าสุด ${esc(github.generated_at||'ยังไม่มีหลักฐานจาก GitHub')}</small><small>แหล่งข้อมูล: ${esc(github.source||'ยังไม่มีรายงาน')}</small><small>${esc(context.refresh||'')}</small></div><div class="item"><b>ศูนย์คิวงานกลาง</b><small>บัตรงานทั้งหมด ${esc(queue.total||0)} · กำลังเดิน ${esc(cards.length)} · ปิดงานแล้ว ${esc((queue.completed||[]).length)}</small><small>งานด่วนเผยแพร่/กู้คืนมาก่อน งานวิจัยและสรุปความจำเป็นงานเบื้องหลัง ใช้รหัสงานเดียวต่อเรื่องเพื่อ retry โดยไม่สร้างซ้ำ</small></div><div class="item"><b class="${state(repair.state)}">${esc(repair.label||'Self-Repair Agent')}</b><small>${esc(repair.detail||'')}</small></div><div class="item"><b class="${state(continuity.status)}">ความต่อเนื่องและการกู้คืน</b>${(continuity.checks||[]).map(x=>`<small class="${state(x.state)}">${esc(x.name)} · ${esc(x.detail)}</small>`).join('')}<small>${esc(continuity.recovery||'')}</small></div><div class="item"><b>หลักฐานผู้ชม</b><small>${esc(audience.retention_state||'')}</small><small>สัญญาณผู้ชมที่บันทึกแล้ว ${esc(audience.feedback_records||0)} รายการ</small></div><details><summary>ดูสถานะ workflow ของทุกฝ่าย</summary>${departments.map(dept=>`<div class="item"><b class="${state(dept.state)}">${esc(dept.department)} · ${esc(dept.label||dept.state)}</b>${(dept.workflows||[]).map(w=>w.url?`<a class="source" href="${esc(w.url)}" target="_blank" rel="noopener"><b>${esc(w.workflow)}</b><small>${esc(w.label||w.state)} · ${esc(w.updated_at||'ยังไม่มีเวลา')}${w.detail?' · '+esc(w.detail):''}</small></a>`:`<small>${esc(w.workflow)} · ${esc(w.label||w.state)}${w.detail?' · '+esc(w.detail):''}</small>`).join('')}</div>`).join('')}</details>`}
fetch(route.api,{cache:'no-store'}).then(r=>r.json()).then(d=>{e('kind').textContent=route.kind;e('title').textContent=d.title;e('purpose').textContent=d.purpose;e('boundary').textContent=d.boundary||'';if(route.body==='learning')renderLearning(d);else if(route.body==='cyber')renderCyber(d);else if(route.body==='operations')renderOperations(d);else renderLab(d)}).catch(()=>e('title').textContent='เชื่อมต่อไม่สำเร็จ');
</script><script>
(()=>{const previous=window.renderOperations;if(!previous)return;const safe=value=>String(value??'—').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));const card=(label,value,detail='')=>`<article class="card"><h2>${safe(label)}</h2><div class="value">${safe(value)}</div>${detail?`<p>${safe(detail)}</p>`:''}</article>`;window.renderOperations=data=>{previous(data);const report=data.production_control||{},buffer=report.shorts_buffer||{},provider=report.provider_health||{},freshness=report.release_artifact_freshness||{},episodes=Array.isArray(report.episodes)?report.episodes:[],waiting=episodes.filter(item=>!item.release_ready).slice(0,4),metrics=document.getElementById('metrics'),primary=document.getElementById('primary');if(metrics)metrics.innerHTML=card('Shorts พร้อมปล่อย',`${buffer.quality_ready??0}/${buffer.target??7}`,buffer.state||'ยังไม่มีรายงาน')+card('ตอนรอตรวจ',waiting.length,waiting.length?'ดูรายละเอียดด้านล่าง':'ไม่มีในรายงานล่าสุด')+card('ภาพ/ไฟล์ล่าสุด',freshness.state||'unknown',freshness.detail||'')+card('ผู้ให้บริการ',provider.state||'unknown',provider.quota||'');if(primary){const blocked=waiting.length?waiting.map(item=>`${item.episode_id||'episode'}: ${item.status||'pending'}`).join(' · '):'ไม่มีตอนค้างในรายงานล่าสุด';primary.insertAdjacentHTML('afterbegin',`<section class="panel"><h2>Production Control</h2><p>รายงานจากสายผลิตล่าสุด: ${safe(report.generated_at||'ไม่ทราบเวลา')}</p><div class="grid">${card('เป้าหมายคลัง',buffer.target??7,buffer.state||'')}${card('พร้อมเผยแพร่',buffer.quality_ready??0,'ผ่านเกตที่ตรวจได้')}${card('ความสดของไฟล์',freshness.state||'unknown',freshness.detail||'')}${card('สถานะผู้ให้บริการ',provider.state||'unknown',provider.quota||'')}</div><p><strong>งานที่ยังไม่พร้อม:</strong> ${safe(blocked)}</p><p class="muted">ข้อมูลนี้แยกชัดระหว่างการตั้งค่าระบบกับโควตาที่พิสูจน์ได้จริง และไม่อ้างว่าอ่านคุณภาพเชิงความหมายของภาพได้หากไม่มีตัวตรวจภาพ</p></section>`);}}})();
</script></body></html>
