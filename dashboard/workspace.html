<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AION Workspace</title><style>:root{--bg:#07121c;--card:#0d2333;--line:#22536d;--ink:#e9f7ff;--muted:#94b5c7;--aqua:#45e4f5;--good:#59e5a4;--warn:#ffc75d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#173d55,transparent 35%),var(--bg);color:var(--ink);font:15px/1.55 system-ui}main{max-width:1160px;margin:auto;padding:38px 22px}.back{color:var(--aqua);text-decoration:none}.eyebrow{color:var(--aqua);font-size:.75rem;letter-spacing:.13em;margin-top:32px}h1{font-size:clamp(2.3rem,5vw,4rem);line-height:1;margin:9px 0}.lead,.note{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:26px}.card{background:linear-gradient(145deg,#102b3d,#0a1c29);border:1px solid var(--line);border-radius:18px;padding:18px}.card h2{font-size:1rem;margin:0 0 8px}.value{font-size:2rem;font-weight:800;color:var(--aqua)}.check{border-top:1px solid var(--line);padding:13px 0}.pill{border:1px solid var(--line);border-radius:99px;padding:3px 8px;font-size:.72rem;color:var(--warn)}.pass{color:var(--good)}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><a class="back" href="/">← ศูนย์สังเกตการณ์</a><div class="eyebrow" id="kind">AION WORKSPACE</div><h1 id="title">กำลังเชื่อมต่อ…</h1><p class="lead" id="purpose"></p><section class="grid" id="metrics"></section><section class="card" style="margin-top:14px" id="details"></section><p class="note" id="boundary"></p></main><script>const path={"/learning":"/api/learning-lab","/cyber":"/api/cyber-guard","/lab":"/api/evolution-lab"}[location.pathname]||"/api/learning-lab",e=id=>document.getElementById(id),esc=x=>{let d=document.createElement('div');d.textContent=x??'';return d.innerHTML};function card(k,v){return `<article class="card"><h2>${esc(k)}</h2><div class="value">${esc(v)}</div></article>`}fetch(path).then(r=>r.json()).then(d=>{e('title').textContent=d.title;e('purpose').textContent=d.purpose;e('boundary').textContent=d.boundary||'';let data=d.mind||d.lab||d.guard||{},metrics=[];for(const [k,v] of Object.entries(data)){if(typeof v==='number'||typeof v==='string')metrics.push(card(k.replaceAll('_',' '),v))}e('metrics').innerHTML=metrics.join('')||card('สถานะ',data.status||'พร้อม');let checks=d.guard?.checks||d.quality?.checks||[];if(checks.length)e('details').innerHTML=checks.map(x=>`<div class="check"><b class="${x.state==='pass'?'pass':''}">${esc(x.name||x.title)} · ${esc(x.state)}</b><br><span class="note">${esc(x.detail)}</span></div>`).join('');else if(d.research?.current)e('details').innerHTML=`<h2>Research brief ปัจจุบัน</h2><p>${esc(d.research.current.topic)}</p><span class="pill">${esc(d.research.current.source_count)} แหล่งอ้างอิง</span>`;else e('details').innerHTML='<p class="note">ยังไม่มีรายการที่ต้องแสดง</p>'}).catch(()=>e('title').textContent='เชื่อมต่อไม่สำเร็จ');</script></body></html>
