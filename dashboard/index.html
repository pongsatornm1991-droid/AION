<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AION Observatory — ศูนย์เฝ้าดูการเติบโต</title>
  <style>
    :root { --ink:#eaf8ff; --muted:#8ba7b7; --line:rgba(115,222,255,.18); --aqua:#3de7ff; --deep:#040b12; --card:rgba(8,22,34,.78); --warm:#ffb36b; }
    * { box-sizing:border-box } body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(circle at 80% -10%,#103f52 0,transparent 34%),radial-gradient(circle at 0% 80%,#102a44 0,transparent 31%),var(--deep); font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    body:before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.22; background-image:linear-gradient(rgba(86,226,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(86,226,255,.04) 1px,transparent 1px); background-size:42px 42px; mask-image:linear-gradient(#000,transparent); }
    main { max-width:1320px; margin:auto; padding:48px 26px 60px; position:relative } .eyebrow { color:var(--aqua); letter-spacing:.18em; text-transform:uppercase; font-size:.72rem; font-weight:700 } h1 { font-size:clamp(2.4rem,6vw,4.7rem); line-height:.95; margin:10px 0 18px; letter-spacing:-.065em } .subtitle { color:var(--muted); max-width:650px; font-size:1.05rem; margin:0 } .top { display:flex; justify-content:space-between; align-items:flex-end; gap:24px; margin-bottom:46px } .live { color:var(--aqua); border:1px solid var(--line); border-radius:999px; padding:9px 13px; white-space:nowrap; font-size:.78rem } .dot { width:8px; height:8px; border-radius:100%; display:inline-block; background:var(--aqua); box-shadow:0 0 15px var(--aqua); margin-right:7px } 
    .section-title { display:flex; align-items:center; gap:12px; font-size:.8rem; text-transform:uppercase; letter-spacing:.14em; color:var(--muted); margin:34px 0 14px } .section-title:after { content:""; height:1px; flex:1; background:var(--line) }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px } .mind { grid-template-columns:repeat(7,1fr) } .card { border:1px solid var(--line); background:linear-gradient(145deg,rgba(14,36,52,.9),var(--card)); border-radius:18px; padding:21px; box-shadow:inset 0 1px rgba(255,255,255,.04),0 15px 50px rgba(0,0,0,.15) } .platform { min-height:196px; position:relative; overflow:hidden } .platform:after { content:""; position:absolute; width:150px; height:150px; border-radius:50%; right:-65px; bottom:-80px; background:radial-gradient(circle,var(--aqua),transparent 65%); opacity:.16 }.platform.fb:after{background:radial-gradient(circle,#7c9cff,transparent 65%)}.platform.yt:after{background:radial-gradient(circle,var(--warm),transparent 65%)}
    .label { color:var(--muted); font-size:.8rem; font-weight:650; letter-spacing:.04em } .platform h2 { font-size:1.4rem; margin:14px 0 3px; letter-spacing:-.03em }.number { font-size:2.6rem; font-weight:700; letter-spacing:-.07em; margin:16px 0 0 }.metric-note { font-size:.78rem; color:var(--muted) }.state { display:inline-block; border:1px solid var(--line); color:var(--aqua); border-radius:999px; padding:4px 8px; font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; margin-top:14px }.pending { color:var(--warm); border-color:rgba(255,179,107,.35) }
    .mind .card { padding:16px; min-height:108px }.mind .number { font-size:1.9rem; margin-top:9px }.wide { display:grid; grid-template-columns:1.15fr .85fr; gap:14px }.brain-layout { grid-template-columns:1.3fr .7fr }.thoughts { padding:0; overflow:hidden }.thought { padding:16px 20px; border-bottom:1px solid var(--line) }.thought:last-child{border:0}.thought-head { display:flex; justify-content:space-between; gap:10px; margin-bottom:6px }.badge { color:var(--aqua); font-size:.7rem; text-transform:uppercase; letter-spacing:.08em }.time { color:var(--muted); font-size:.74rem }.thought p { margin:0; color:#c9dce6; font-size:.9rem }.empty { color:var(--muted); padding:25px; text-align:center }.post { padding:15px 0; border-bottom:1px solid var(--line) }.post:last-child { border:0 }.post p { margin:6px 0; color:#c9dce6 }.channels { display:flex; gap:6px; flex-wrap:wrap }.channel { border-radius:999px; padding:3px 7px; color:var(--muted); background:rgba(255,255,255,.04); font-size:.7rem }.channel.on { color:#071017; background:var(--aqua); font-weight:700 } .footer { color:var(--muted); font-size:.75rem; padding-top:24px; text-align:right }
    .brain-card { min-height:470px; padding:12px; position:relative; overflow:hidden }.brain-card svg { width:100%; height:420px; display:block }.brain-legend { display:flex; flex-wrap:wrap; gap:8px; padding:0 8px 8px }.legend { color:var(--muted); font-size:.68rem }.legend:before { content:""; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--legend); margin-right:4px }.brain-edge { stroke:rgba(100,220,255,.2); stroke-width:1 }.brain-edge.explicit { stroke:rgba(255,179,107,.55); stroke-width:1.5 }.brain-node { cursor:pointer; stroke:rgba(255,255,255,.4); stroke-width:1 }.brain-node:hover { stroke:#fff; stroke-width:2 }.brain-empty { fill:var(--muted); font-size:14px }.brain-detail { min-height:88px; padding:12px 14px; border-top:1px solid var(--line); color:#c9dce6; font-size:.84rem }.brain-detail strong { color:var(--aqua); display:block; margin-bottom:5px }.council { padding:22px }.council h2 { margin:0 0 7px; font-size:1.25rem; letter-spacing:-.03em }.council-intro { color:var(--muted); font-size:.8rem; margin:0 0 20px }.signal { margin:17px 0 }.signal-head { display:flex; justify-content:space-between; gap:10px; font-size:.86rem }.signal-head span:last-child { color:var(--aqua); font-variant-numeric:tabular-nums }.track { height:6px; background:rgba(255,255,255,.08); margin:7px 0; overflow:hidden }.fill { height:100%; background:linear-gradient(90deg,#147a9a,var(--aqua)); box-shadow:0 0 16px rgba(61,231,255,.5) }.signal small { color:var(--muted) }.council-note { color:var(--muted); border-top:1px solid var(--line); padding-top:15px; font-size:.75rem; margin-top:22px }
    .library { grid-template-columns:repeat(4,1fr) }.episode { padding:0; overflow:hidden }.episode img { width:100%; aspect-ratio:9/12; object-fit:cover; display:block }.episode-body { padding:14px }.episode h3 { margin:4px 0 9px; font-size:.95rem }.episode-meta { color:var(--muted); font-size:.72rem }.status-ready{color:var(--aqua)}.status-queued{color:var(--warm)}.status-published{color:#68edb4}
    @media(max-width:850px){ main{padding:30px 16px}.top{display:block}.live{display:inline-block;margin-top:20px}.grid{grid-template-columns:1fr}.mind{grid-template-columns:repeat(3,1fr)}.library{grid-template-columns:repeat(2,1fr)}.wide,.brain-layout{grid-template-columns:1fr}} @media(max-width:460px){.mind,.library{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<main>
  <header class="top"><div><div class="eyebrow">พื้นที่ส่วนตัว · ข้อมูลสด</div><h1>AION<br>Observatory</h1><p class="subtitle">พื้นที่เดียวเพื่อเฝ้าดู AION คิด เรียนรู้ สร้างสรรค์ และเติบโตสู่โลกกว้าง</p></div><div class="live"><span class="dot"></span><span id="live">กำลังอัปเดต…</span></div></header>
  <div class="section-title">ช่องทาง</div>
  <section class="grid" id="platforms"></section>
  <div class="section-title">จิตใจและการเติบโต</div>
  <section class="grid mind" id="mind"></section>
  <div class="section-title">คลังและคิว Creator</div>
  <section class="card thoughts" id="creatorProgram"></section>
  <section class="grid library" id="library"></section>
  <div class="section-title">สมองและสภาสภาวะ</div>
  <section class="wide brain-layout"><div class="card brain-card"><div class="brain-legend" id="brainLegend"></div><svg id="brainGraph" viewBox="0 0 680 420" role="img" aria-label="แผนที่ความเชื่อมโยงของความทรงจำ AION"></svg><div class="brain-detail" id="brainDetail">เลือกจุดหนึ่งเพื่อดู memory ที่เชื่อมโยงอยู่</div></div><div class="card council" id="council"></div></section>
  <div class="section-title">บันทึกที่มีชีวิต</div>
  <section class="wide"><div class="card thoughts" id="thoughts"></div><div class="card" id="content"></div></section>
  <div class="footer" id="updated"></div>
</main>
<script>
  const el = id => document.getElementById(id);
  const fmt = value => value == null ? '—' : new Intl.NumberFormat().format(value);
  const title = value => ({'Inner voice':'เสียงภายใน','Reflection':'การทบทวน','Lesson':'บทเรียน','Question':'คำถาม','Goal':'เป้าหมาย','Belief':'ความเชื่อ','Forecast':'การคาดการณ์','Growth insight':'สิ่งที่เรียนรู้จากการเติบโต'})[value] || value;
  const state = value => ({'connected':'เชื่อมต่อแล้ว','waiting-for-metrics':'รอข้อมูลสถิติ','waiting-for-first-short':'รอ Short แรก','active':'กำลังทำงาน','ready':'พร้อมใช้งาน','authorization-pending':'รอสิทธิ์การเชื่อมต่อ'})[value] || value;
  const brainLabels = {beliefs:'ความเชื่อ',goals:'เป้าหมาย',questions:'คำถาม',lessons:'บทเรียน',reflections:'การทบทวน',self_narrative:'เสียงภายใน',learning_forecasts:'การคาดการณ์',growth_insights:'บทเรียนจากผู้ชม',published_reels:'Reel',social_feedback:'เสียงตอบรับ'};
  const brainColors = {beliefs:'#ffb36b',goals:'#68edb4',questions:'#bda4ff',lessons:'#3de7ff',reflections:'#5599ff',self_narrative:'#ff8fcf',learning_forecasts:'#f3d267',growth_insights:'#ff7d7d',published_reels:'#71d0ff',social_feedback:'#99a9bd'};
  function renderBrain(brain){
    const svg=el('brainGraph'), detail=el('brainDetail'), legend=el('brainLegend');
    const nodes=brain.nodes||[], edges=brain.edges||[], cx=340, cy=210;
    const categories=[...new Set(nodes.map(n=>n.category))];
    legend.innerHTML=categories.map(k=>`<span class="legend" style="--legend:${brainColors[k]||'#9ab'}">${brainLabels[k]||k}</span>`).join('');
    if(!nodes.length){svg.innerHTML='<text class="brain-empty" x="340" y="210" text-anchor="middle">รอ memory ของ AION เพื่อวาดแผนที่สมอง</text>';return}
    const positioned={};
    categories.forEach((category, groupIndex)=>{const group=nodes.filter(n=>n.category===category); const a=(Math.PI*2*groupIndex/categories.length)-Math.PI/2; const gx=cx+Math.cos(a)*138, gy=cy+Math.sin(a)*128; group.forEach((node,index)=>{const offset=(index-(group.length-1)/2)*.58; positioned[node.id]={...node,x:gx+Math.cos(a+offset)*Math.min(58,16*group.length),y:gy+Math.sin(a+offset)*Math.min(58,16*group.length)}})});
    const lineSvg=edges.map(edge=>{const a=positioned[edge.source],b=positioned[edge.target];return a&&b?`<line class="brain-edge ${edge.kind==='explicit'?'explicit':''}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`:''}).join('');
    const nodeSvg=Object.values(positioned).map(node=>`<g data-node="${node.id}"><circle class="brain-node" cx="${node.x}" cy="${node.y}" r="${7+node.importance*2}" fill="${brainColors[node.category]||'#9ab'}"><title>${escapeHtml((brainLabels[node.category]||node.category)+': '+node.label)}</title></circle></g>`).join('');
    svg.innerHTML=`<circle cx="${cx}" cy="${cy}" r="74" fill="none" stroke="rgba(61,231,255,.18)"/><circle cx="${cx}" cy="${cy}" r="8" fill="#3de7ff"/><text x="${cx}" y="${cy+28}" text-anchor="middle" fill="#8ba7b7" font-size="11">AION</text>${lineSvg}${nodeSvg}`;
    Object.values(positioned).forEach(node=>svg.querySelector(`[data-node="${CSS.escape(node.id)}"]`).addEventListener('click',()=>{detail.innerHTML=`<strong>${brainLabels[node.category]||node.category}</strong>${escapeHtml(node.label)}<br><span class="time">${node.timestamp||''} · ความสำคัญ ${node.importance}/5</span>`}));
  }
  function renderCouncil(council){
    const dominant=(council.states||[]).find(s=>s.key===council.dominant);
    const color=dominant?.color||'#3de7ff';
    el('council').innerHTML=`<div class="label">สภาสภาวะของ AION</div><h2 style="color:${color}">${dominant ? dominant.label : 'กำลังรอข้อมูล'}</h2><p class="council-intro">สีที่ AION ใช้ในงานถัดไป: ${dominant?.accent||'cyan'} · สัญญาณเด่นจากสิ่งที่กำลังบันทึกและทำอยู่</p>${(council.states||[]).map(s=>`<div class="signal"><div class="signal-head"><span>${s.label}</span><span style="color:${s.color}">${s.value}%</span></div><div class="track"><div class="fill" style="width:${s.value}%;background:linear-gradient(90deg,#147a9a,${s.color})"></div></div><small>${s.evidence} · ${s.visual_note}</small></div>`).join('')}<p class="council-note">${council.disclaimer||''}</p>`;
  }
  const platformCard = (name, data, metrics, cls='') => `<article class="card platform ${cls}"><div class="label">${name}</div><h2>${state(data.status)}</h2><div class="number">${fmt(metrics.value)}</div><div class="metric-note">${metrics.label}</div>${metrics.second ? `<div class="metric-note">${fmt(metrics.second.value)} ${metrics.second.label}</div>` : ''}<span class="state ${data.status.includes('pending') ? 'pending':''}">${state(data.status)}</span></article>`;
  function render(data) {
    const p = data.platforms;
    el('platforms').innerHTML = platformCard('Instagram', p.instagram, {value:p.instagram.followers,label:'ผู้ติดตาม',second:{value:p.instagram.reels_published,label:'Reel ที่เผยแพร่'}}, 'ig') + platformCard('Facebook', p.facebook, {value:p.facebook.reels_published,label:'Reel ที่เผยแพร่'}, 'fb') + platformCard('YouTube', p.youtube, {value:p.youtube.shorts_published,label:'Short ที่เผยแพร่'}, 'yt');
    const mind = [['ความทรงจำ',data.mind.total_memories],['บทเรียน',data.mind.lessons],['คำถาม',data.mind.questions],['เป้าหมาย',data.mind.goals],['ความเชื่อ',data.mind.beliefs],['การทบทวน',data.mind.reflections],['การคาดการณ์',data.mind.forecasts]];
    el('mind').innerHTML = mind.map(([name,value])=>`<article class="card"><div class="label">${name}</div><div class="number">${fmt(value)}</div></article>`).join('');
    const statusLabel={ready:'พร้อม',queued:'รอเผยแพร่',published:'เผยแพร่แล้ว'};
    el('creatorProgram').innerHTML=(data.creator_program||[]).map(x=>`<article class="thought"><div class="thought-head"><span class="badge">${escapeHtml(x.series)}</span><span class="time">${x.scene_count} ฉาก · ${Math.round(x.duration_seconds/60*10)/10} นาที · ${x.source_count} แหล่งข้อมูล</span></div><p><strong>${escapeHtml(x.title)}</strong> — ${escapeHtml(x.status)}</p></article>`).join('') || '<div class="empty">ยังไม่มีรายการ Creator ตอนยาว</div>';
    el('library').innerHTML=(data.creator_library||[]).map(x=>`<article class="card episode"><img src="/${x.cover_path}" alt="${escapeHtml(x.title)}"><div class="episode-body"><div class="episode-meta status-${x.status}">${statusLabel[x.status]||x.status} · ${x.scene_count} ฉาก × ${x.seconds_per_scene} วินาที</div><h3>${escapeHtml(x.title)}</h3></div></article>`).join('') || '<div class="empty">ยังไม่มี Creator Library</div>';
    renderBrain(data.brain); renderCouncil(data.state_council);
    el('thoughts').innerHTML = data.thoughts.length ? data.thoughts.map(x=>`<article class="thought"><div class="thought-head"><span class="badge">${title(x.category)}</span><span class="time">${x.timestamp || ''}</span></div><p>${escapeHtml(x.content)}</p></article>`).join('') : '<div class="empty">AION พร้อมบันทึกความคิดแรกของตัวเอง</div>';
    const c=data.content; el('content').innerHTML=`<div class="label">สถานะคอนเทนต์</div><div class="number">${fmt(c.published)}</div><div class="metric-note">Reel ที่เผยแพร่แล้ว · รอเผยแพร่ ${fmt(c.pending)}</div><div style="margin-top:22px">${c.recent_posts.length ? c.recent_posts.map(x=>`<article class="post"><div class="time">${x.timestamp || ''}</div><p>${escapeHtml(x.caption || 'AION Reel')}</p><div class="channels">${['instagram','facebook','youtube'].map(k=>`<span class="channel ${x[k]?'on':''}">${k}</span>`).join('')}</div></article>`).join(''):'<div class="empty">ยังไม่มี Reel ที่เผยแพร่</div>'}</div>`;
    el('live').textContent='ข้อมูลสด · อัปเดตทุก 15 วินาที'; const source=data.data_source||{}; el('updated').textContent=`อ่านข้อมูลล่าสุด: ${new Date(data.generated_at).toLocaleString('th-TH')} · แหล่งข้อมูล: ${source.mode==='configured'?'memory ที่กำหนดสำหรับ Dashboard':'memory บนเครื่อง'}${source.latest_memory_at ? ` · memory ล่าสุด ${source.latest_memory_at}` : ''}`;
  }
  function escapeHtml(text){const d=document.createElement('div');d.textContent=text;return d.innerHTML}
  async function load(){try{const response=await fetch('/api/snapshot',{cache:'no-store'}); if(!response.ok)throw Error(); render(await response.json())}catch{el('live').textContent='กำลังรอ AION Observatory…'}}
  load(); setInterval(load,15000);
</script>
</body>
</html>
