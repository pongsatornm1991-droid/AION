<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AION Finance Observatory</title><style>body{margin:0;background:radial-gradient(circle at 85% 0,#504009,transparent 38%),linear-gradient(135deg,#171505,#162416);color:#fff7dc;font:15px/1.55 system-ui}main{max-width:1080px;margin:auto;padding:38px 22px 70px}.back{color:#ffda5d;text-decoration:none}.eyebrow{color:#ffda5d;font-size:.75rem;font-weight:800;letter-spacing:.14em;margin-top:30px}h1{font-size:clamp(2.3rem,6vw,4rem);line-height:1;margin:10px 0}.lead,.note{color:#c9c59e}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:26px 0}.card{background:linear-gradient(145deg,#2d351e,#18261f);border:1px solid #81742e;border-radius:18px;padding:19px}.card h2{margin:0 0 8px;font-size:1rem}.value{font-size:2rem;font-weight:800;color:#ffda5d}.section{font-size:.75rem;letter-spacing:.13em;font-weight:800;color:#c9c59e;margin:34px 0 12px}.provider{border-top:1px solid #5f6138;padding:15px 0}.provider:first-child{border-top:0}.state{display:inline-block;color:#ffda5d;border:1px solid #ffda5d;border-radius:99px;padding:3px 8px;font-size:.72rem}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><main><a class="back" href="/">← ศูนย์สังเกตการณ์</a><div class="eyebrow">AION COMPANY · READ-ONLY FINANCE</div><h1 id="title">กำลังเปิดห้องการเงิน…</h1><p class="lead" id="purpose"></p><section class="grid" id="metrics"></section><div class="section">ผู้ให้บริการและยอดคงเหลือ</div><section class="card" id="providers"></section><div class="section">ขอบเขตการทำงาน</div><p class="card note" id="boundary"></p></main><script>const e=id=>document.getElementById(id),esc=x=>{const d=document.createElement('div');d.textContent=x??'';return d.innerHTML};fetch('/api/finance',{cache:'no-store'}).then(r=>r.json()).then(d=>{const o=d.operations||{};e('title').textContent=d.title;e('purpose').textContent=d.purpose;e('metrics').innerHTML=`<article class="card"><h2>ภาพที่สร้างจริง</h2><div class="value">${esc(o.generated_scene_images||0)}</div><p class="note">หน่วยผลิตภาพที่ตรวจย้อนกลับได้</p></article><article class="card"><h2>วิดีโอที่ประกอบแล้ว</h2><div class="value">${esc(o.assembled_videos||0)}</div><p class="note">ผลผลิตที่ส่งจาก Studio</p></article><article class="card"><h2>ต้นทุนเงินที่ยืนยัน</h2><div class="value">${o.known_currency_cost===null?'—':esc(o.known_currency_cost)}</div><p class="note">${esc(o.currency_status)}</p></article>`;e('providers').innerHTML=(d.providers||[]).map(p=>`<article class="provider"><span class="state">${esc(p.state)}</span><h2>${esc(p.name)}</h2><p class="note">${esc(p.detail)}</p><b>ยอดคงเหลือ: ${esc(p.remaining)}</b></article>`).join('');e('boundary').textContent=d.boundary}).catch(()=>e('title').textContent='เชื่อมต่อไม่สำเร็จ');</script></html>
