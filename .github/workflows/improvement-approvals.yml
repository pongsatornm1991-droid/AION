name: AION - improvement approval check
on:
  # Internal experiments are autonomous now.  Retain this only as a manual
  # compatibility/recovery tool for historic Telegram callback records.
  workflow_dispatch: {}
concurrency:
  group: aion-memory-data
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check-owner-decision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pongsatornm1991-droid/aion-memory-data
          token: ${{ secrets.MEMORY_REPO_PAT }}
          path: memory_data
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - env:
          AION_MEMORY_ROOT: memory_data
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tools/run_improvement_approvals.py
      - uses: ./.github/actions/commit-and-push
        with:
          paths: "-A"
          message: "AION improvement approval"
          cwd: memory_data
