name: AION - production control

on:
  schedule:
    - cron: "17 * * * *"
  workflow_run:
    workflows:
      - AION - subject-first scene production
      - AION - assemble illustrated Creator episode
      - AION - Creator queue quality gate
      - AION - Creator release readiness
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: aion-production-control
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install Pillow
      - name: Publish a truthful production-control report
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_API_KEY: ${{ secrets.OPENAI_IMAGE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        run: python tools/production_control.py
      - name: Commit the public report when it changed
        run: |
          git config user.name aion-bot
          git config user.email aion-bot@users.noreply.github.com
          git add public/aion-production-control.json
          if ! git diff --cached --quiet; then
            git commit -m "AION: refresh production control"
            # This file is an observability snapshot.  Other workflow runs
            # legitimately refresh it while this job is running, so retain
            # the newest remote snapshot on a same-file conflict instead of
            # failing a healthy inspection and leaving the dashboard stale.
            if ! git pull --rebase origin main; then
              if git diff --name-only --diff-filter=U | grep -qx 'public/aion-production-control.json'; then
                git checkout --ours public/aion-production-control.json
                git add public/aion-production-control.json
                GIT_EDITOR=true git rebase --continue
              else
                echo "Unexpected rebase conflict; leave it visible for repair."
                exit 1
              fi
            fi
            { git push || { git pull --rebase --autostash origin main && git push; } || { sleep 10; git pull --rebase --autostash origin main && git push; } || { sleep 20; git pull --rebase --autostash origin main && git push; }; }
          fi
