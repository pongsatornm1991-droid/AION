name: AION - media-library hygiene

on:
  schedule:
    # Every day at 10:15 Asia/Bangkok: keep generated-media growth bounded.
    - cron: "15 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: aion-asset-hygiene
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  purge-expired-orphans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pongsatornm1991-droid/aion-memory-data
          token: ${{ secrets.MEMORY_REPO_PAT }}
          path: memory_data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Purge only unreferenced generated media older than 14 days
        env:
          AION_MEMORY_ROOT: memory_data
        run: python tools/asset_hygiene.py --retention-days 14 --purge
      - name: Commit the cleanup record only when files expired
        run: |
          git config user.name "aion-bot"
          git config user.email "aion-bot@users.noreply.github.com"
          # Stage only the two media trees.  The Python guard accepts files
          # only when they were unreferenced and older than 14 days.
          git add -A content assets
          if ! git diff --cached --quiet; then
            git commit -m "AION: purge expired unreferenced generated media"
            git push
          fi
