name: AION - platform delivery recovery

# Retry only records that already exist.  This workflow never drafts content,
# never creates media, and never bypasses a quality gate; it simply resumes a
# safe pending delivery after a transient provider/API failure.
on:
  schedule:
    - cron: "2 * * * *"
  workflow_dispatch: {}

concurrency:
  group: aion-memory-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resume-pending-delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pongsatornm1991-droid/aion-memory-data
          token: ${{ secrets.MEMORY_REPO_PAT }}
          path: memory_data
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: Resume only existing pending Reel or image delivery
        env:
          AION_MEMORY_ROOT: memory_data
          GITHUB_REPOSITORY: ${{ github.repository }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          python main.py run-reel-publish
          python main.py run-instagram-publish
      # YouTube intentionally is not retried by this hourly recovery worker:
      # an unrelated retry must never consume the scheduled 20:00–22:00 slot
      # or create a second upload on the same day. The dedicated YouTube
      # workflow owns that cadence and its idempotent queue.
      - name: Persist delivery checkpoints
        working-directory: memory_data
        run: |
          git config user.name "aion-bot"
          git config user.email "aion-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then git commit -m "AION platform delivery recovery"; { git push || { git pull --rebase --autostash origin main && git push; } || { sleep 10; git pull --rebase --autostash origin main && git push; } || { sleep 20; git pull --rebase --autostash origin main && git push; }; }; fi
