name: AION - autonomous internal improvement cycle
on:
  schedule:
    # Runs after the creative intention is recorded; it starts its bounded
    # experiment itself, so no separate experiment-runner schedule is needed.
    - cron: "15 */6 * * *"
  workflow_dispatch: {}
concurrency:
  group: aion-memory-data
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  start-bounded-experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pongsatornm1991-droid/aion-memory-data
          token: ${{ secrets.MEMORY_REPO_PAT }}
          path: memory_data
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - env:
          AION_MEMORY_ROOT: memory_data
        run: python tools/run_improvement_review.py
      - working-directory: memory_data
        run: |
          git config user.name "aion-bot"
          git config user.email "aion-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then git commit -m "AION improvement review"; { git push || { git pull --rebase --autostash origin main && git push; } || { sleep 10; git pull --rebase --autostash origin main && git push; } || { sleep 20; git pull --rebase --autostash origin main && git push; }; }; fi
