name: AION - subject-first scene production
on:
  schedule:
    # Produce *before* release days, not on the same day. Thursday makes the
    # Friday/Saturday Short buffer and Sunday's long-form; Sunday makes the
    # next Monday/Wednesday Short buffer. This leaves time for assembly,
    # audio QA and retry.
    - cron: "7 2 * * 0,4"
  workflow_dispatch: {}
permissions: {contents: write}
concurrency:
  group: aion-creator-scenes
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: Preflight image production configuration
        env:
          OPENAI_IMAGE_API_KEY: ${{ secrets.OPENAI_IMAGE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python tools/run_platform_preflight.py --require image
      - name: Complete the planned Studio shift in recoverable 25-scene batches
        env:
          IMAGE_PROVIDER: openai
          OPENAI_IMAGE_API_KEY: ${{ secrets.OPENAI_IMAGE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-2' }}
          OPENAI_IMAGE_QUALITY: ${{ vars.OPENAI_IMAGE_QUALITY || 'medium' }}
        run: |
          # Build a verified release buffer before the evening slots. Thursday
          # makes two fresh Shorts for Friday/Saturday plus Sunday's long-form;
          # Sunday makes Monday/Wednesday's two Shorts. No publisher is allowed
          # to use an old Reel merely because the buffer is empty.
          weekday="$(date -u +%u)"
          short_limit=2
          python tools/produce_creator_scenes.py --format short --episode-limit "$short_limit" --batch-size 25 --max-scenes 120 --require-complete
          if [[ "$weekday" == "4" ]]; then
            python tools/produce_creator_scenes.py --format long-form --episode-limit 1 --batch-size 25 --max-scenes 120 --require-complete
          fi
      - run: |
          git config user.name aion-bot
          git config user.email aion-bot@users.noreply.github.com
          git add assets/content-library/aion-stories/ content/creator_series/
          if ! git diff --cached --quiet; then
            git commit -m "AION: produce subject-first scenes"
            # Other autonomous workflows may update main while images render.
            # Rebase the generated assets onto that newer work before pushing
            # so a successful image run is not reported as failed at its last step.
            git pull --rebase origin main
            git push
          fi
