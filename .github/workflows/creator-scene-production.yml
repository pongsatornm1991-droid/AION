name: AION - subject-first scene production
on:
  schedule:
    # Monday starts the release buffer; Tuesday and Wednesday complete and
    # recover it.  No publishing appointment should depend on same-day media
    # creation.
    - cron: "7 2 * * 1,2,3"
  workflow_dispatch: {}
permissions: {contents: write}
concurrency:
  group: aion-creator-scenes
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pongsatornm1991-droid/aion-memory-data
          token: ${{ secrets.MEMORY_REPO_PAT }}
          path: memory_data
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: Retire unfinished storyboards that duplicate published subjects
        env:
          AION_MEMORY_ROOT: memory_data
        run: python tools/audit_creator_novelty.py
      - name: Verify actual narration timing before creating scene images
        # This uses the same configured voice as final assembly. A long line
        # returns to Story before any image-production work begins.
        env:
          REEL_VOICE_PROVIDER: ${{ vars.REEL_VOICE_PROVIDER || 'edge-tts' }}
          REEL_VOICE: ${{ vars.REEL_VOICE || 'en-US-AvaMultilingualNeural' }}
        run: python tools/preflight_creator_narration.py --require-eligible
      - name: Preflight image production configuration
        env:
          OPENAI_IMAGE_API_KEY: ${{ secrets.OPENAI_IMAGE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python tools/run_platform_preflight.py --require image
      - name: Complete the planned Studio shift in recoverable 25-scene batches
        env:
          IMAGE_PROVIDER: openai
          OPENAI_IMAGE_API_KEY: ${{ secrets.OPENAI_IMAGE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-2' }}
          OPENAI_IMAGE_QUALITY: ${{ vars.OPENAI_IMAGE_QUALITY || 'medium' }}
        run: |
          # Build the complete Thursday–Sunday release set in advance: four
          # distinct Shorts. Wednesday retries
          # only genuinely unfinished storyboards; it never substitutes an old
          # Reel merely because the buffer is empty.
          short_limit=4
          # An empty spare slot is a planning signal, not a production failure.
          # Fail only for a real rendering fault so completed images are always
          # committed and can continue to assembly.
          python tools/produce_creator_scenes.py --format short --episode-limit "$short_limit" --batch-size 25 --max-scenes 120 --require-no-failures
      - run: |
          git config user.name aion-bot
          git config user.email aion-bot@users.noreply.github.com
          # Covers are generated with the new scene set and are a hard
          # pre-publication asset; never leave them behind on the runner.
          git add assets/content-library/aion-stories/ content/creator_series/ content/reels/*-cover.png
          if ! git diff --cached --quiet; then
            git commit -m "AION: produce subject-first scenes"
            # Other autonomous workflows may update main while images render.
            # Rebase the generated assets onto that newer work before pushing
            # so a successful image run is not reported as failed at its last step.
            git pull --rebase origin main
            git push
          fi
