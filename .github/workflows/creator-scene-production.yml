name: AION - subject-first scene production
on:
  push:
    branches: [main]
    paths:
      - "content/creator_series/**"
      # A timing-policy repair must re-enter Studio immediately; otherwise a
      # storyboard that was safely held before paid image work would wait for
      # tomorrow's scheduled shift despite the fix already being on main.
      - "brain/audio_visual_timing.py"
      - "brain/narration_preflight.py"
      - "brain/visual_story_policy.py"
      - "tools/preflight_creator_narration.py"
      - ".github/workflows/creator-scene-production.yml"
  # A story brief is committed by GitHub Actions.  Those token-authenticated
  # commits do not reliably start a downstream `push` workflow, so without
  # this explicit handoff a qualified new Short can sit until tomorrow's
  # scheduled Studio shift.  A completed research-to-story run is the
  # authoritative production handoff and is safe to observe directly.
  workflow_run:
    workflows: [AION - Research to story brief]
    types: [completed]
  schedule:
    # Daily production shift (2026-09-21: publishing moved from a 4-day to
    # a 7-day cadence, so production must keep pace every day too -- see
    # youtube-creator.yml). No publishing appointment should depend on
    # same-day media creation; each day's shift tops the buffer back up
    # for a later release slot, never today's own.
    - cron: "7 2 * * *"
  workflow_dispatch: {}
permissions: {contents: write}
concurrency:
  group: aion-creator-scenes
  cancel-in-progress: false
jobs:
  produce:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pongsatornm1991-droid/aion-memory-data
          token: ${{ secrets.MEMORY_REPO_PAT }}
          path: memory_data
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: Retire unfinished storyboards that duplicate published subjects
        env:
          AION_MEMORY_ROOT: memory_data
        run: python tools/audit_creator_novelty.py
      - name: Verify actual narration timing before creating scene images
        # This uses the same configured voice as final assembly. An overlong
        # line receives one provenance-preserving split and remeasurement
        # before image-production work begins; an unsafe result still returns
        # to Story without spending on images.
        env:
          REEL_VOICE_PROVIDER: ${{ vars.REEL_VOICE_PROVIDER || 'openai' }}
          REEL_VOICE: ${{ vars.REEL_VOICE || 'nova' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_API_KEY: ${{ secrets.OPENAI_IMAGE_API_KEY }}
        run: python tools/preflight_creator_narration.py --require-eligible --write-timeline
      - name: Preflight image production configuration
        env:
          OPENAI_IMAGE_API_KEY: ${{ secrets.OPENAI_IMAGE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python tools/run_platform_preflight.py --require image
      - name: Complete the planned Studio shift in recoverable 25-scene batches
        env:
          IMAGE_PROVIDER: openai
          OPENAI_IMAGE_API_KEY: ${{ secrets.OPENAI_IMAGE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-2' }}
          OPENAI_IMAGE_QUALITY: ${{ vars.OPENAI_IMAGE_QUALITY || 'medium' }}
        run: |
          # Keep a full week of the daily release set in advance: seven
          # distinct Shorts (2026-09-21: raised from four to match the move
          # to daily publishing). Every day's run retries only genuinely
          # unfinished storyboards; it never substitutes an old Reel merely
          # because the buffer is empty.
          short_limit=7
          # An empty spare slot is a planning signal, not a production failure.
          # Fail only for a real rendering fault so completed images are always
          # committed and can continue to assembly.
          python tools/produce_creator_scenes.py --format short --episode-limit "$short_limit" --batch-size 25 --max-scenes 120 --require-no-failures
      - run: |
          git config user.name aion-bot
          git config user.email aion-bot@users.noreply.github.com
          # Covers are generated with the new scene set and are a hard
          # pre-publication asset; never leave them behind on the runner.
          git add assets/content-library/aion-stories/ content/creator_series/ content/reels/*-cover.png
          if ! git diff --cached --quiet; then
            git commit -m "AION: produce subject-first scenes"
            # Other autonomous workflows may update main while images render.
            # Rebase the generated assets onto that newer work before pushing
            # so a successful image run is not reported as failed at its last step.
            git pull --rebase origin main
            { git push || { git pull --rebase --autostash origin main && git push; } || { sleep 10; git pull --rebase --autostash origin main && git push; } || { sleep 20; git pull --rebase --autostash origin main && git push; }; }
          fi
