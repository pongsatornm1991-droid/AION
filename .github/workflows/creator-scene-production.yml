name: AION - subject-first scene production
on:
  schedule:
    # 09:00 Asia/Bangkok on the three Studio production days.  New scenes
    # are deliberately made well before the evening publishing window so
    # assembly and Quality can stop a weak episode without creating a gap.
    - cron: "0 2 * * 1,3,5"
  workflow_dispatch: {}
permissions: {contents: write}
concurrency:
  group: aion-creator-scenes
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: Preflight image production configuration
        env:
          OPENAI_IMAGE_API_KEY: ${{ secrets.OPENAI_IMAGE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python tools/run_platform_preflight.py --require image
      - name: Complete one approved storyboard in recoverable 25-scene batches
        env:
          IMAGE_PROVIDER: openai
          OPENAI_IMAGE_API_KEY: ${{ secrets.OPENAI_IMAGE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-2' }}
          OPENAI_IMAGE_QUALITY: ${{ vars.OPENAI_IMAGE_QUALITY || 'medium' }}
        run: python tools/produce_creator_scenes.py --batch-size 25 --max-scenes 120
      - run: |
          git config user.name aion-bot
          git config user.email aion-bot@users.noreply.github.com
          git add assets/content-library/aion-stories/ content/creator_series/
          if ! git diff --cached --quiet; then
            git commit -m "AION: produce subject-first scenes"
            # Other autonomous workflows may update main while images render.
            # Rebase the generated assets onto that newer work before pushing
            # so a successful image run is not reported as failed at its last step.
            git pull --rebase origin main
            git push
          fi
