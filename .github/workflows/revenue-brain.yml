name: AION - revenue readiness
on:
  schedule:
    # Revenue readiness changes slowly and never spends.  A daily review is
    # enough and leaves the six-hour production lane available.
    - cron: "35 2 * * *"
  workflow_dispatch: {}
concurrency:
  group: aion-memory-data
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pongsatornm1991-droid/aion-memory-data
          token: ${{ secrets.MEMORY_REPO_PAT }}
          path: memory_data
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - env: {AION_MEMORY_ROOT: memory_data}
        run: python tools/run_revenue_brain.py
      - working-directory: memory_data
        run: |
          git config user.name "aion-bot"
          git config user.email "aion-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then git commit -m "AION revenue readiness"; git push; fi
