name: AION - approved content experiment runner
on:
  # ImprovementReview.send_pending_once() already creates the bounded
  # experiment in the same transaction.  Keep a manual recovery entry point,
  # but do not spend a shared-memory slot re-running the same queue every 6h.
  workflow_dispatch: {}
concurrency:
  group: aion-memory-data
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  queue-approved-experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pongsatornm1991-droid/aion-memory-data
          token: ${{ secrets.MEMORY_REPO_PAT }}
          path: memory_data
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - env: {AION_MEMORY_ROOT: memory_data}
        run: python tools/run_experiment_runner.py
      - uses: ./.github/actions/commit-and-push
        with:
          paths: "-A"
          message: "AION approved experiment plan"
          cwd: memory_data
