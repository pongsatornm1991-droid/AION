name: AION - automatic motion production

on:
  workflow_run:
    workflows: [AION - subject-first scene production]
    types: [completed]
  schedule:
    # Daily recovery pass.  It turns only an approved current episode into
    # motion, and uses the local kinetic fallback when Veo is unavailable, so
    # a temporary provider credential/outage can never drain the Shorts queue.
    - cron: "37 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: aion-creator-motion
  cancel-in-progress: false

permissions: {contents: write}

jobs:
  produce-motion:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: Create real motion for the approved episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AION_VIDEO_MODEL: ${{ vars.AION_VIDEO_MODEL || 'veo-3.1-lite-generate-preview' }}
        run: python tools/produce_creator_motion.py --require-complete
      - name: Persist completed motion sources
        run: |
          git config user.name aion-bot
          git config user.email aion-bot@users.noreply.github.com
          git add assets/content-library/aion-stories/ content/creator_series/
          if ! git diff --cached --quiet; then
            git commit -m "AION: create automatic Veo motion scenes"
            git pull --rebase origin main
            { git push || { git pull --rebase --autostash origin main && git push; } || { sleep 10; git pull --rebase --autostash origin main && git push; } || { sleep 20; git pull --rebase --autostash origin main && git push; }; }
          fi
