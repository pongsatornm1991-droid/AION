name: AION - Render Creator episode 004
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  render-story:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          sudo timeout 90s apt-get update -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=20
          sudo timeout 90s apt-get install -y ffmpeg
          pip install -r requirements.txt
      - env:
          REEL_VOICE_PROVIDER: ${{ vars.REEL_VOICE_PROVIDER || 'edge-tts' }}
          REEL_VOICE: ${{ vars.REEL_VOICE || 'en-US-AvaMultilingualNeural' }}
        run: python tools/render_story_episode_004.py
      - run: |
          git config user.name "aion-bot"
          git config user.email "aion-bot@users.noreply.github.com"
          git add content/reels/
          if ! git diff --cached --quiet; then git commit -m "AION: render Creator episode 004"; git push; fi
