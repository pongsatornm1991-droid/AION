name: AION - admin operations audit

on:
  push:
    branches: [main]
    paths:
      - 'brain/admin_operations.py'
      - 'brain/company_operations.py'
      - 'brain/company_work_registry.py'
      - 'brain/company_quality_audit.py'
      - 'tests/test_company_operations.py'
      - 'tests/test_dashboard.py'
      - '.github/workflows/admin-operations.yml'
  schedule:
    - cron: "35 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install dashboard test dependency
        run: python -m pip install --disable-pip-version-check python-dotenv
      - run: python -m unittest tests.test_company_operations tests.test_dashboard -q
