name: AION - admin operations audit

on:
  schedule:
    - cron: "35 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m unittest tests.test_company_operations tests.test_dashboard -q
