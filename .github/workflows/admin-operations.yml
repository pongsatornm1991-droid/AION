name: AION - admin operations audit

on:
  push:
    branches: [main]
    paths:
      - 'brain/admin_operations.py'
      - 'brain/social.py'
      - 'brain/company_operations.py'
      - 'brain/company_work_registry.py'
      - 'brain/company_quality_audit.py'
      - 'tests/test_company_operations.py'
      - 'tests/test_dashboard.py'
      - 'tests/test_social.py'
      - '.github/workflows/reel-cycle.yml'
      - '.github/workflows/instagram-cycle.yml'
      - '.github/workflows/youtube-creator.yml'
      - '.github/workflows/social-cycle.yml'
      - '.github/workflows/admin-operations.yml'
  schedule:
    - cron: "35 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install dashboard audit dependencies
        # The operations snapshot includes Video QA timing checks, which read
        # Pillow through brain.video_quality.  Keep this lean but complete so
        # the audit verifies the real dashboard path rather than failing on
        # an import before it can inspect operations.
        run: python -m pip install --disable-pip-version-check python-dotenv Pillow
      - run: python -m unittest tests.test_company_operations tests.test_dashboard tests.test_social -q
