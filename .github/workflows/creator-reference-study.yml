name: AION - creator reference study

on:
  schedule:
    - cron: "25 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: aion-memory-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pongsatornm1991-droid/aion-memory-data
          token: ${{ secrets.MEMORY_REPO_PAT }}
          path: memory_data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Study one user-curated reference without copying it
        env:
          AION_MEMORY_ROOT: memory_data
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
          OPENAI_COMPATIBLE_BASE_URL: ${{ vars.OPENAI_COMPATIBLE_BASE_URL }}
          OPENAI_COMPATIBLE_MODEL: ${{ vars.OPENAI_COMPATIBLE_MODEL }}
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
        run: python tools/run_creator_reference_study.py
      - name: Persist the craft lesson
        working-directory: memory_data
        run: |
          git config user.name "aion-bot"
          git config user.email "aion-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "AION creator craft study ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
