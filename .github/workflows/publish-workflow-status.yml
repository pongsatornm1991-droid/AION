name: AION - publish workflow health

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  actions: read
  contents: write

concurrency:
  group: aion-workflow-health
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Build a read-only status record from GitHub Actions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/publish_workflow_status.py
      - name: Commit only the public health summary
        run: |
          git config user.name aion-bot
          git config user.email aion-bot@users.noreply.github.com
          git add public/aion-workflow-status.json
          if ! git diff --cached --quiet; then
            git commit -m "AION: refresh workflow health"
            git pull --rebase origin main
            git push
          fi
