name: AION - publish workflow health

on:
  schedule:
    - cron: "7 * * * *"
  # Refresh the public operational board immediately after core work completes;
  # the hourly schedule remains a recovery path if this event is delayed.
  workflow_run:
    workflows:
      - AION - YouTube Creator Studio
      - AION - YouTube long-form Saturday
      - AION - social post cycle
      - AION - Instagram content cycle
      - AION - Instagram Reel cycle
      - AION - delivery evidence watchdog
      - AION - subject-first scene production
      - AION - assemble illustrated Creator episode
      - AION - costume continuity briefs
      - AION - Research to story brief
      - AION - Daily Growth Pulse
      - AION - YouTube public audience signals
      - AION - external learning cycle
      - AION - Cyber Guard defensive audit
      # Engineering observers are intentionally excluded here. A status
      # commit itself runs tests; listening to that test completion made the
      # board create a new commit and restart the same loop. Their failures
      # still alert through Automation Health Monitor and appear in the next
      # hourly status refresh.
      - AION - Creator release readiness
      - AION - admin operations audit
    types: [completed]
  workflow_dispatch: {}

permissions:
  actions: read
  contents: write

concurrency:
  group: aion-workflow-health
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh the status writer before reading Actions history
        # The dashboard status file is shared output.  Start from the newest
        # main branch before producing it so a completed production workflow
        # cannot make this read-only observer fail at its final commit.
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Build a read-only status record from GitHub Actions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/publish_workflow_status.py
      - name: Commit only the public health summary
        run: |
          git config user.name aion-bot
          git config user.email aion-bot@users.noreply.github.com
          git add public/aion-workflow-status.json
          if ! git diff --cached --quiet; then
            git commit -m "AION: refresh workflow health"
            git pull --rebase origin main
            { git push || { git pull --rebase --autostash origin main && git push; } || { sleep 10; git pull --rebase --autostash origin main && git push; } || { sleep 20; git pull --rebase --autostash origin main && git push; }; }
          fi
