name: AION - social post cycle

# Runs run-social-cycle so AION drafts and (if safe) posts new
# content to Facebook without anyone running it by hand. Raised from
# every 6 hours to hourly (2026-08-30, at the user's request for
# AION to act on its own initiative more often) -- still safe to run
# this often because a HIGH_RISK daily budget (30/day, see
# brain/tools.py DEFAULT_BUDGETS) caps how many posts can actually go
# out even if every single run finds something worth posting, and a
# run that finds no good seed simply does nothing. Change the cron
# below to adjust further.
#
# Shares the same private memory_data repo as check-comments.yml (see
# that file's header comment for why memory/ is not tracked in this
# public repo).

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  social-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AION code
        uses: actions/checkout@v4

      - name: Checkout AION memory (private repo)
        uses: actions/checkout@v4
        with:
          repository: pongsatornm1991-droid/aion-memory-data
          token: ${{ secrets.MEMORY_REPO_PAT }}
          path: memory_data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run run-social-cycle
        env:
          AION_MEMORY_ROOT: memory_data
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py run-social-cycle

      - name: Persist memory changes back to the private repo
        working-directory: memory_data
        run: |
          git config user.name "aion-bot"
          git config user.email "aion-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No memory changes this run -- nothing to commit."
          else
            git commit -m "AION memory update ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
