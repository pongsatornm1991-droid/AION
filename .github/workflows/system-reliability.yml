name: AION - system reliability

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inspect-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python tools/run_system_reliability.py
      # The full deterministic suite already runs in tests.yml for every
      # push.  Keep this workflow focused on the reliability inspection and
      # its contract instead of running the same suite twice.
      - run: python -m unittest tests.test_system_reliability -q
