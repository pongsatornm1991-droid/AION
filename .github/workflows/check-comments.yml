name: AION - check comments

# Runs check-comments on a schedule so AION replies to Facebook
# comments without anyone having to run it by hand. GitHub's own
# runners execute this -- it works whether or not any local machine
# is on. Minimum useful interval per GitHub's own scheduling rules is
# 5 minutes; exact timing is best-effort (GitHub may delay a run
# under high platform load), and a schedule is auto-disabled if this
# repository goes 60 days with no commits at all -- push something
# occasionally to keep it alive.
#
# AION's memory/ folder is intentionally NOT part of this repo (see
# .gitignore) since this repo is public and memory/ is AION's own
# private, evolving state -- it lives instead in a separate PRIVATE
# repo, checked out into memory_data/ at the start of every run and
# committed back at the end if anything changed. Without this, every
# run would start from a blank memory and the "never reply to the
# same comment twice" guarantee would silently break.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# All AION workflows share one private, git-backed memory_data repo
# with no locking of its own: two runs (any mix of these 7 workflows)
# executing at the same time each check out their own independent
# snapshot, so both can see the same "proposed" action or unread
# Telegram update and act on it a second time before either has
# pushed. This is exactly what happened on 2026-08-31: overlapping
# runs of check-profile-approvals.yml each approved+executed the same
# pending bio-change proposal, burning the whole day's IDENTITY_CHANGE
# budget on one real approval tap. A single concurrency group across
# all 7 workflows serializes every run that touches memory_data --
# cancel-in-progress:false queues a run instead of racing it, since
# these are cheap idempotent polls where waiting a few seconds costs
# nothing.
concurrency:
  group: aion-memory-data
  cancel-in-progress: false

jobs:
  check-comments:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AION code
        uses: actions/checkout@v4

      - name: Checkout AION memory (private repo)
        uses: actions/checkout@v4
        with:
          repository: pongsatornm1991-droid/aion-memory-data
          token: ${{ secrets.MEMORY_REPO_PAT }}
          path: memory_data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify deterministic safeguards
        run: python run_tests.py

      - name: Run check-comments
        env:
          AION_MEMORY_ROOT: memory_data
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_COMPATIBLE_BASE_URL: ${{ vars.OPENAI_COMPATIBLE_BASE_URL }}
          OPENAI_COMPATIBLE_MODEL: ${{ vars.OPENAI_COMPATIBLE_MODEL }}
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py check-comments

      - name: Persist memory changes back to the private repo
        working-directory: memory_data
        run: |
          git config user.name "aion-bot"
          git config user.email "aion-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No memory changes this run -- nothing to commit."
          else
            git commit -m "AION memory update ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
