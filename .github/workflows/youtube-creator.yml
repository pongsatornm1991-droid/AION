name: AION - YouTube Creator Studio

on:
  schedule:
    # Publish Shorts within the 20:00–22:00 Asia/Bangkok window. Sunday moves
    # to 21:00 so the weekly long-form release at 20:15 has breathing room.
    # Avoid GitHub's congested top-of-hour scheduler window where possible.
    - cron: "43 13 * * 1-6"
    - cron: "0 14 * * 0"
  workflow_dispatch: {}

concurrency:
  group: aion-memory-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  youtube-creator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pongsatornm1991-droid/aion-memory-data
          token: ${{ secrets.MEMORY_REPO_PAT }}
          path: memory_data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Preflight YouTube configuration
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python tools/run_platform_preflight.py --require youtube
      - name: Release one previously quality-gated private Creator video
        # Recovery only for legacy AION uploads that already passed their
        # saved Quality Gate.  This fixes old Private uploads before making a
        # new daily Short, without touching any unrelated channel video.
        env:
          AION_MEMORY_ROOT: memory_data
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python main.py release-private-youtube-creator | tee youtube-release-report.txt
      - name: Verify deterministic safeguards
        run: python -m unittest tests.test_youtube_creator_queue tests.test_youtube_cycle tests.test_youtube_quality tests.test_video_quality -q
      - name: Queue one finished AION Studio episode
        env:
          AION_MEMORY_ROOT: memory_data
        run: python main.py prepare-youtube-creator --content-kind short
      - name: Publish one authorized Creator episode
        id: creator-publish
        env:
          AION_MEMORY_ROOT: memory_data
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'public' }}
        run: python main.py run-youtube-creator-publish --content-kind short | tee youtube-creator-publish-report.txt
      - name: Keep the daily Shorts promise with a completed Reel fallback
        # Creator episodes are the preferred format.  If no Creator Short is
        # ready, publish exactly one already quality-gated daily Reel instead.
        # This prevents a gap without making a duplicate upload.
        if: ${{ always() }}
        env:
          AION_MEMORY_ROOT: memory_data
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'public' }}
        run: |
          if [[ -f youtube-creator-publish-report.txt ]] && grep -q "Stage: no-authorized-creator-episode" youtube-creator-publish-report.txt; then
            python main.py run-youtube-publish
          else
            echo "Creator Short handled the daily YouTube slot; no fallback upload."
          fi
      - name: Persist private memory
        working-directory: memory_data
        run: |
          git config user.name "aion-bot"
          git config user.email "aion-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then git commit -m "AION Creator YouTube update"; git push; fi
