name: AION - YouTube Creator Studio

# Assembly makes an episode eligible for the queue; it must never publish at
# the moment rendering finishes.  Public release is intentionally limited to
# the Bangkok appointments below (or an explicit manual operator dispatch).
on:
  schedule:
    # Shorts-first cadence: Thursday through Sunday at 20:30 Bangkok.
    # Monday–Wednesday remain clear for research and production.
    - cron: "30 13 * * 0,4,5,6"
  workflow_dispatch:
    inputs:
      release_kind:
        description: "Recovery release type; use auto for the scheduled calendar"
        required: false
        default: "auto"
        type: choice
        options: [auto, short, long-form]
      episode_id:
        description: "Optional exact Creator episode id for an immediate, audited release"
        required: false
        type: string

concurrency:
  # Publishing must never wait behind a research/reflection write.  The
  # three YouTube release workflows share this narrow lane so they cannot
  # double-publish, while independent company work remains parallel.
  group: aion-youtube-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  youtube-creator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pongsatornm1991-droid/aion-memory-data
          token: ${{ secrets.MEMORY_REPO_PAT }}
          path: memory_data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Preflight YouTube configuration
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python tools/run_platform_preflight.py --require youtube
      - name: Release one previously quality-gated private Creator video
        # Recovery only for legacy AION uploads that already passed their
        # saved Quality Gate.  This fixes old Private uploads before making a
        # new daily Short, without touching any unrelated channel video.
        if: ${{ github.event_name != 'workflow_run' }}
        env:
          AION_MEMORY_ROOT: memory_data
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python main.py release-private-youtube-creator | tee youtube-release-report.txt
      - name: Verify deterministic safeguards
        run: python -m unittest tests.test_youtube_creator_queue tests.test_youtube_cycle tests.test_youtube_quality tests.test_video_quality -q
      - name: Select the scheduled release lane
        # The scheduled cadence is Shorts-only while 16:9 production is
        # paused. A manual long-form recovery remains explicit and cannot
        # silently consume a scheduled slot.
        env:
          REQUESTED_KIND: ${{ github.event.inputs.release_kind || 'auto' }}
          SCHEDULE: ${{ github.event.schedule || '' }}
        run: |
          if [[ "$REQUESTED_KIND" != "auto" ]]; then
            RELEASE_KIND="$REQUESTED_KIND"
          else
            RELEASE_KIND="short"
          fi
          echo "RELEASE_KIND=$RELEASE_KIND" >> "$GITHUB_ENV"
          echo "Selected $RELEASE_KIND release lane."
      - name: Queue one finished AION Studio episode
        env:
          AION_MEMORY_ROOT: memory_data
          EPISODE_ID: ${{ github.event.inputs.episode_id || '' }}
        run: |
          args=(--content-kind "$RELEASE_KIND")
          if [[ -n "$EPISODE_ID" ]]; then args+=(--episode-id "$EPISODE_ID"); fi
          python main.py prepare-youtube-creator "${args[@]}"
      - name: Persist a pre-release Quality Gate decision
        env:
          AION_MEMORY_ROOT: memory_data
          EPISODE_ID: ${{ github.event.inputs.episode_id || '' }}
        run: |
          args=(--content-kind "$RELEASE_KIND")
          if [[ -n "$EPISODE_ID" ]]; then args+=(--episode-id "$EPISODE_ID"); fi
          python main.py quality-youtube-creator "${args[@]}" | tee youtube-creator-quality-report.txt
      - name: Publish one authorized Creator episode
        id: creator-publish
        env:
          AION_MEMORY_ROOT: memory_data
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'public' }}
          EPISODE_ID: ${{ github.event.inputs.episode_id || '' }}
        run: |
          args=(--content-kind "$RELEASE_KIND")
          if [[ -n "$EPISODE_ID" ]]; then args+=(--episode-id "$EPISODE_ID"); fi
          python main.py run-youtube-creator-publish "${args[@]}" | tee youtube-creator-publish-report.txt
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && ! grep -q "Stage: published" youtube-creator-publish-report.txt; then
            echo "An explicitly requested release did not reach YouTube; refusing a false-green run."
            exit 1
          fi
      - name: Record an empty slot; never substitute an old Reel
        # A release slot must contain a newly produced Studio episode.  An old
        # Reel may be technically valid but is not a replacement for today's
        # promised work, so the next production cycle is allowed to recover it.
        if: ${{ always() }}
        env:
          AION_MEMORY_ROOT: memory_data
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'public' }}
        run: |
          if [[ -f youtube-creator-publish-report.txt ]] && grep -q "Stage: no-authorized-creator-episode" youtube-creator-publish-report.txt; then
            echo "No new Studio episode is ready; historical Reels are intentionally not uploaded as a fallback."
          else
            echo "Creator $RELEASE_KIND handled the scheduled YouTube slot."
          fi
      - name: Persist private memory
        working-directory: memory_data
        run: |
          git config user.name "aion-bot"
          git config user.email "aion-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "AION Creator YouTube update"
            git pull --rebase origin main
            { git push || { git pull --rebase --autostash origin main && git push; } || { sleep 10; git pull --rebase --autostash origin main && git push; } || { sleep 20; git pull --rebase --autostash origin main && git push; }; }
          fi
