name: AION - Creator queue quality gate

# A completed render becomes useful to the release buffer only after this
# local, evidence-preserving gate.  This job never contacts YouTube and may
# run independently of publishing, so production does not wait for a release
# appointment.
on:
  workflow_run:
    workflows: [AION - assemble illustrated Creator episode]
    types: [completed]
  schedule:
    - cron: "35 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: aion-creator-quality-queue
  cancel-in-progress: false

jobs:
  quality-queue:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pongsatornm1991-droid/aion-memory-data
          token: ${{ secrets.MEMORY_REPO_PAT }}
          path: memory_data
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Verify queue and video safeguards
        run: python -m unittest tests.test_youtube_creator_queue tests.test_youtube_quality tests.test_video_quality -q
      - name: Queue the next completed Shorts episode
        env:
          AION_MEMORY_ROOT: memory_data
        run: |
          python main.py prepare-youtube-creator --content-kind short
      - name: Persist Quality Gate evidence before any publication appointment
        env:
          AION_MEMORY_ROOT: memory_data
        run: python main.py quality-youtube-creator
      - name: Persist private queue evidence
        working-directory: memory_data
        run: |
          git config user.name "aion-bot"
          git config user.email "aion-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "AION Creator pre-release quality evidence"
            git pull --rebase origin main
            { git push || { git pull --rebase --autostash origin main && git push; } || { sleep 10; git pull --rebase --autostash origin main && git push; } || { sleep 20; git pull --rebase --autostash origin main && git push; }; }
          fi
