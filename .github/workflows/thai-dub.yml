name: AION - Thai dub

on:
  schedule:
    # Safety net only: fires once daily in case the workflow_run trigger
    # below is ever missed (e.g. a recovery publish outside the normal
    # slot). The real trigger is the publish workflow completing.
    - cron: "30 14 * * *"
  workflow_run:
    # Owner, 2026-09-29: "เละทำ ภาษาไทยให้ทันที" (make the Thai version
    # happen right away) -- start dubbing the moment a new episode
    # actually publishes instead of waiting up to a fixed 1h buffer for
    # the next scheduled tick. dub_batch()'s own durable per-episode
    # dedupe record makes firing this twice for the same publish (once
    # here, once from the daily safety-net cron) a harmless no-op.
    workflows: [AION - YouTube Creator Studio]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: aion-memory-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  thai-dub:
    # A cancelled publish run persisted nothing new to dub; only skip on
    # cancellation, never on failure -- a failed publish attempt can still
    # leave an earlier, already-published episode waiting for its dub.
    if: ${{ always() && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pongsatornm1991-droid/aion-memory-data
          token: ${{ secrets.MEMORY_REPO_PAT }}
          path: memory_data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Translate, localize, and dub the oldest undubbed published episode
        env:
          AION_MEMORY_ROOT: memory_data
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
          OPENAI_COMPATIBLE_BASE_URL: ${{ vars.OPENAI_COMPATIBLE_BASE_URL }}
          OPENAI_COMPATIBLE_MODEL: ${{ vars.OPENAI_COMPATIBLE_MODEL }}
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
        run: python tools/run_thai_dub.py | tee thai-dub-report.txt
      - name: Persist the dubbed audio file to this repo
        uses: ./.github/actions/commit-and-push
        with:
          paths: "content/reels_thai/"
          message: "AION Thai dub audio ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
      - name: Persist the dub record to the memory repo
        uses: ./.github/actions/commit-and-push
        with:
          paths: "-A"
          message: "AION Thai dub record ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          cwd: memory_data
