name: AION - YouTube release-window recovery

# A transient provider error must not turn a planned release day into a silent
# gap.  These are idempotent retries inside the agreed 20:00–22:00 Bangkok
# window; they only resume a quality-gated, already-authorized episode.
on:
  schedule:
    # 21:05 and 21:35 Bangkok on every Shorts release day. These leave a
    # clear recovery window after the 20:30 scheduled publication.
    - cron: "5,35 14 * * 0,4,5,6"
  workflow_dispatch: {}

concurrency:
  # Retry has to wait only for the active YouTube release, never for an
  # unrelated research or analytics cycle.
  group: aion-youtube-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  retry-within-release-window:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pongsatornm1991-droid/aion-memory-data
          token: ${{ secrets.MEMORY_REPO_PAT }}
          path: memory_data
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: Retry only today's authorized release type
        env:
          AION_MEMORY_ROOT: memory_data
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'public' }}
        run: |
          weekday="$(date -u +%u)"
          python main.py run-youtube-creator-publish --content-kind short
      - name: Persist retry evidence
        working-directory: memory_data
        run: |
          git config user.name "aion-bot"
          git config user.email "aion-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "AION YouTube release-window retry"
            git pull --rebase origin main
            { git push || { git pull --rebase --autostash origin main && git push; } || { sleep 10; git pull --rebase --autostash origin main && git push; } || { sleep 20; git pull --rebase --autostash origin main && git push; }; }
          fi
