name: AION - Creator release readiness

# This is the early-warning layer for the fixed publishing appointments.  It
# does not generate media or publish anything: it makes a missing 144-hour
# buffer visible early enough for the normal Studio shifts to recover it.
on:
  schedule:
    # Run after the Tuesday/Wednesday 09:07 Studio shifts have had time to
    # produce its release buffer; checking before it would create a false
    # shortage alert while the planned work is still legitimately underway.
    - cron: "30 5 * * *" # 12:30 Asia/Bangkok
  workflow_run:
    # Refresh immediately when the production pipeline changes.  The daily
    # check remains the fallback, while this avoids a stale 96/144-hour board
    # between scheduled runs.
    workflows:
      - AION - Research to story brief
      - AION - subject-first scene production
      - AION - assemble illustrated Creator episode
      - AION - Creator queue quality gate
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write
  # A shortage is actionable: after a cited storyboard is staged, this
  # workflow starts the existing bounded Studio production workflow.  It does
  # not upload or publish anything itself.
  actions: write

concurrency:
  group: aion-release-readiness
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pongsatornm1991-droid/aion-memory-data
          token: ${{ secrets.MEMORY_REPO_PAT }}
          path: memory_data
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: Publish the read-only release-buffer record
        env:
          AION_MEMORY_ROOT: memory_data
        run: python tools/run_release_readiness.py
      - name: Plan every missing appointment and prepare the next cited storyboard
        # This is an observer and planning handoff: no upload, no reuse of old
        # content and no platform/account change.  The separate Studio shift
        # renders only its normal bounded 2-Short/1-primary batch.
        env:
          AION_MEMORY_ROOT: memory_data
        run: python tools/recover_release_buffer.py | tee release-buffer-recovery.json
      - name: Start bounded Studio recovery when a new storyboard is ready
        # Before this handoff existed, a Thursday/Friday shortage could be
        # planned successfully but then wait until Monday's image shift.  A
        # fixed release appointment must recover immediately from an eligible,
        # newly staged storyboard.  The Studio workflow retains all image,
        # novelty and quality safeguards; this step only dispatches it when
        # the recovery report explicitly says production is needed.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python -c "import json; print(str(bool(json.load(open('release-buffer-recovery.json', encoding='utf-8')).get('needs_production'))).lower())" | grep -qx true; then
            curl --fail --silent --show-error --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/creator-scene-production.yml/dispatches" \
              --data '{"ref":"main"}'
            echo "Started bounded Studio recovery for the newly staged release episode."
          else
            echo "No asset-complete recovery storyboard is ready; research remains the only safe next step."
          fi
      - name: Persist recovery handoffs before the next workflow can read them
        # recover_release_buffer may create a cited brief, Story handoff, or
        # work card in the private memory repository.  Without this commit a
        # successful recovery vanished with the runner and the next shift
        # unnecessarily repeated the same planning work.
        working-directory: memory_data
        run: |
          git config user.name "aion-bot"
          git config user.email "aion-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "AION release-buffer recovery handoff"
            git pull --rebase origin main
            git push
          fi
      - name: Commit the visible readiness record
        run: |
          git config user.name aion-bot
          git config user.email aion-bot@users.noreply.github.com
          git add public/aion-release-readiness.json content/creator_series/ assets/content-library/aion-stories/
          if ! git diff --cached --quiet; then
            git commit -m "AION: refresh release readiness"
            git pull --rebase origin main
            git push
          fi
      - name: Surface a buffer shortage without misreporting a planning issue as a broken workflow
        env:
          AION_MEMORY_ROOT: memory_data
        run: |
          python tools/run_release_readiness.py
          echo "Release-buffer shortages stay visible in Operations Center and trigger the bounded storyboard recovery above."
