name: AION - assemble illustrated Creator episode

on:
  # A completed scene batch or an approved script-timing repair should enter
  # assembly immediately. The existing hourly timer remains a recovery net,
  # but a ready episode no longer waits for its next tick.
  push:
    branches: [main]
    paths:
      - "content/creator_series/**"
      - "assets/content-library/aion-stories/**"
      # A renderer/timing repair must also retry the already-ready episode;
      # otherwise an urgent fix waits for the hourly recovery schedule.
      - "brain/audio_visual_timing.py"
      - "brain/visual_story_policy.py"
      - "tools/reel_render.py"
      - "tools/assemble_creator_episode.py"
      - "tools/render_creator_episode.py"
      - ".github/workflows/assemble-creator-episode.yml"
  workflow_run:
    # Commits made by a GitHub Actions token do not reliably create a new
    # push-triggered run. Listen directly for motion completion so a finished
    # new scene set always proceeds to assembly without waiting for the hourly
    # recovery schedule.
    # Readiness observes the finished result; it must never re-trigger
    # assembly or it becomes an observer-to-producer loop.  Only production
    # workflows are allowed to hand work into this stage.
    workflows: [AION - subject-first scene production, AION - automatic motion production]
    types: [completed]
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: aion-creator-assembly
  cancel-in-progress: false

jobs:
  assemble:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Verify the audio-visual timing gate
        run: python -m unittest tests.test_audio_visual_timing tests.test_reel_render tests.test_assemble_creator_episode -q
      - name: Assemble only an asset-complete episode
        env:
          REEL_VOICE_PROVIDER: ${{ vars.REEL_VOICE_PROVIDER || 'openai' }}
          REEL_VOICE: ${{ vars.REEL_VOICE || 'nova' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_API_KEY: ${{ secrets.OPENAI_IMAGE_API_KEY }}
          AION_REQUIRE_MOTION_VIDEO: 'true'
        run: python tools/assemble_creator_episode.py --require-rendered
      - name: Commit only a verified assembly result
        run: |
          git config user.name aion-bot
          git config user.email aion-bot@users.noreply.github.com
          git add content/reels/ content/creator_series/
          if ! git diff --cached --quiet; then
            git commit -m "AION: assemble illustrated Creator episode"
            git pull --rebase origin main
            git push
          fi
