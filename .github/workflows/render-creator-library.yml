name: AION - Render Creator library
on: {workflow_dispatch: {}}
permissions: {contents: write}
concurrency:
  # Every renderer commits under content/reels; prevent non-fast-forward
  # pushes or one renderer overwriting another's output.
  group: aion-creator-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg && pip install -r requirements.txt
      - env:
          REEL_VOICE_PROVIDER: ${{ vars.REEL_VOICE_PROVIDER || 'openai' }}
          REEL_VOICE: ${{ vars.REEL_VOICE || 'nova' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_API_KEY: ${{ secrets.OPENAI_IMAGE_API_KEY }}
        run: python tools/render_creator_library.py
      - run: |
          git config user.name aion-bot
          git config user.email aion-bot@users.noreply.github.com
          git add content/reels/
          if ! git diff --cached --quiet; then git commit -m "AION: render first Creator library"; git push; fi
