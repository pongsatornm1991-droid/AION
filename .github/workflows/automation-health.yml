name: AION - Automation Health Monitor

on:
  workflow_run:
    workflows:
      - AION - check comments
      - AION - cross-post latest Reel to Facebook
      - AION - deterministic tests
      - AION - Instagram content cycle
      - AION - Instagram Reel cycle
      - AION - external learning cycle
      - AION - reflection cycle
      - AION - social post cycle
      - AION - YouTube Shorts cycle
      - AION - YouTube Creator Studio
      - AION - YouTube long-form archive/manual recovery
      - AION - Creator release readiness
      - AION - subject-first scene production
      - AION - assemble illustrated Creator episode
      - AION - Creator queue quality gate
      - AION - costume continuity briefs
      - AION - Research to story brief
      - AION - cross-post verified Creator Short
      - AION - Instagram feedback
      - AION - Daily Growth Pulse
      - AION - weekly evolution review
      - AION - Obsidian brain dashboard
      - AION - propose profile change
      - AION - legacy profile approval check
      - AION - system reliability
      - AION - Cyber Guard defensive audit
      - AION - admin operations audit
      # Audited 2026-09-21: everything below was a real production
      # workflow with no failure alert at all -- more than half the
      # fleet was silently unmonitored, which is how a genuine content
      # conflict in publish-public-summary.yml went unnoticed. Added
      # every remaining workflow so a silent failure is never the way
      # one gets found again.
      - AION - Creator intention cycle
      - AION - OpenAI connection test
      - AION - Publish public brain summary
      - AION - Render Creator episode
      - AION - Render Creator episode 002
      - AION - Render Creator episode 003
      - AION - Render Creator episode 004
      - AION - Render Creator library
      - AION - Scientific Discovery Lab
      - AION - YouTube discovery learning
      - AION - YouTube public audience signals
      - AION - YouTube release-window recovery
      - AION - approved content experiment runner
      - AION - audience accessibility checks
      - AION - audience-independent inquiry
      - AION - automatic motion production
      - AION - autonomous internal improvement cycle
      - AION - bounded self repair
      - AION - content experiment evaluator
      - AION - creator reference study
      - AION - delivery evidence watchdog
      - AION - event-aware cognitive drive
      - AION - improvement approval check
      - AION - media-library hygiene
      - AION - platform delivery recovery
      - AION - publish workflow health
      - AION - revenue readiness
      - AION - self-improvement proposals
      - AION - self-narrative
      - AION - YouTube publication drift check
    types: [completed]

permissions:
  contents: read

jobs:
  notify-on-failure:
    # 'cancelled' is deliberately excluded alongside success/skipped.
    # Audited 2026-09-21 against real run history: several of the
    # workflows in the watch list above (publish-workflow-status.yml,
    # release-readiness.yml, and others) are triggered by workflow_run
    # off many upstream workflows and share a concurrency group with
    # cancel-in-progress: false. GitHub only keeps one run queued per
    # group, so when several upstream completions land close together
    # (common with 58 workflows on tight schedules) the older queued
    # run is cancelled in favour of the newest one -- routine, harmless
    # queue eviction, not a real failure. In one ~10h window this
    # produced 17 cancelled conclusions from just two workflows, which
    # would have meant 17 false "needs attention" pages -- exactly the
    # alert-fatigue failure mode this monitor exists to avoid causing.
    # A workflow that is genuinely stuck still surfaces: either its own
    # run eventually completes as failure, or the next scheduled/cron
    # run of the same workflow does, and that alerts normally.
    if: ${{ github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.conclusion != 'skipped' && github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify AION owner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          message=$(printf 'AION automation needs attention\nWorkflow: %s\nStatus: %s\n%s' "$WORKFLOW_NAME" "$WORKFLOW_CONCLUSION" "$WORKFLOW_URL")
          curl --fail --silent --show-error --max-time 20 \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
