name: AION - YouTube long-form Saturday

on:
  # Saturday 20:15 Asia/Bangkok, inside the agreed 20:00–22:00 window. Review
  # after 28 days using YouTube Audience
  # analytics; this is an initial family-friendly appointment, not a universal
  # optimum time.
  schedule:
    - cron: "15 13 * * 6"
  workflow_dispatch: {}

concurrency:
  # Keep the Saturday release independent of research-memory work, but mutually
  # exclusive with Short publishing and recovery retries.
  group: aion-youtube-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  youtube-longform:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pongsatornm1991-droid/aion-memory-data
          token: ${{ secrets.MEMORY_REPO_PAT }}
          path: memory_data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install video inspection tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Verify safeguards
        run: python -m unittest tests.test_youtube_creator_queue tests.test_youtube_cycle tests.test_youtube_quality tests.test_video_quality tests.test_assemble_creator_episode -q
      - name: Restore an inspectable caption track when a finished episode is missing one
        run: python tools/assemble_creator_episode.py --backfill-subtitles
      - name: Commit restored caption tracks before Quality Gate
        run: |
          git config user.name "aion-bot"
          git config user.email "aion-bot@users.noreply.github.com"
          git add -A content/reels
          if ! git diff --cached --quiet; then
            git commit -m "AION: restore Creator caption track"
            git pull --rebase origin main
            git push
          fi
      - name: Queue one finished long-form AION episode
        env:
          AION_MEMORY_ROOT: memory_data
        run: python main.py prepare-youtube-creator --content-kind long-form
      - name: Run the long-form quality gate and publishing handoff
        env:
          AION_MEMORY_ROOT: memory_data
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'public' }}
        # A missing candidate or a Quality Gate block is not an infrastructure
        # failure.  The queue stores the exact decision for the Dashboard and
        # Telegram sends only meaningful alerts; reserve a failed workflow for
        # a genuinely broken command or unavailable dependency.
        run: python main.py run-youtube-creator-publish --content-kind long-form
      - name: Persist private memory
        working-directory: memory_data
        run: |
          git config user.name "aion-bot"
          git config user.email "aion-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "AION long-form YouTube update"
            git pull --rebase origin main
            git push
          fi
