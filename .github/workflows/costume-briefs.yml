name: AION - costume continuity briefs

on:
  push:
    paths: ["content/creator_series/**", "brain/costume_direction.py", "tools/build_costume_briefs.py"]
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch: {}

permissions: {contents: write}

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python tools/build_costume_briefs.py
      - run: python -m unittest tests.test_costume_direction
      - run: |
          git config user.name aion-bot
          git config user.email aion-bot@users.noreply.github.com
          git add public/aion-costume-briefs.json
          if ! git diff --cached --quiet; then git commit -m "AION: refresh costume briefs"; git push; fi
