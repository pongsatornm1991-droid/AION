name: AION - OpenAI connection test

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  connection-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AION code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify OpenAI Responses API
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
        run: |
          python - <<'PY'
          from providers.openai import OpenAIProvider

          text = OpenAIProvider().generate(
              "Reply with exactly: AION_OPENAI_CONNECTED"
          )
          if "AION_OPENAI_CONNECTED" not in text:
              raise SystemExit("OpenAI returned an unexpected response")
          print("OpenAI connection verified successfully.")
          PY
