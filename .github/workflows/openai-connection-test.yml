name: AION - OpenAI connection test

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  connection-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AION code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify OpenAI Responses API
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
        run: |
          python - <<'PY'
          from providers.openai import OpenAIProvider

          text = OpenAIProvider().generate(
              "Reply with exactly: AION_OPENAI_CONNECTED"
          )
          if "AION_OPENAI_CONNECTED" not in text:
              raise SystemExit("OpenAI returned an unexpected response")
          print("OpenAI connection verified successfully.")
          PY

      - name: Verify OpenAI image generation
        env:
          IMAGE_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-2' }}
          OPENAI_IMAGE_BASE_URL: ${{ vars.OPENAI_IMAGE_BASE_URL || 'https://api.openai.com/v1' }}
          OPENAI_IMAGE_QUALITY: ${{ vars.OPENAI_IMAGE_QUALITY || 'medium' }}
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path

          from tools.openai_image import generate_social_image

          with tempfile.TemporaryDirectory() as directory:
              image_path = Path(directory) / "aion-openai-test.png"
              generated = generate_social_image(
                  "A quiet first light forming a new memory.",
                  str(image_path),
              )
              if not generated or image_path.read_bytes()[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit("OpenAI image generation failed")
          print("OpenAI image generation verified successfully.")
          PY
