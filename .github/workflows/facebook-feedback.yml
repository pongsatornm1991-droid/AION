name: AION - Facebook feedback

# Read-only Facebook Page feedback (2026-10-04). Changed follower and per-post
# reaction/comment/share counters are recorded in private memory so any
# decision about Facebook's role rests on real numbers. Never publishes.
on:
  schedule:
    # Offset from instagram-feedback (:48) and the hourly inquiry (:45).
    - cron: "53 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: aion-memory-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  facebook-feedback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AION code
        uses: actions/checkout@v4

      - name: Checkout AION memory
        uses: actions/checkout@v4
        with:
          repository: pongsatornm1991-droid/aion-memory-data
          token: ${{ secrets.MEMORY_REPO_PAT }}
          path: memory_data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Capture Facebook feedback
        env:
          AION_MEMORY_ROOT: memory_data
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: python main.py run-facebook-feedback

      - name: Persist memory changes
        working-directory: memory_data
        run: |
          git config user.name "aion-bot"
          git config user.email "aion-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No feedback changes this run."
          else
            git commit -m "AION Facebook feedback ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            { git push || { git pull --rebase --autostash origin main && git push; } || { sleep 10; git pull --rebase --autostash origin main && git push; } || { sleep 20; git pull --rebase --autostash origin main && git push; }; }
          fi
