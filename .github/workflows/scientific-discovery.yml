name: AION - Scientific Discovery Lab
on:
  schedule: [{cron: "40 1 * * *"}]
  workflow_dispatch: {}
permissions: {contents: read}
jobs:
  design-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: pongsatornm1991-droid/aion-memory-data, token: "${{ secrets.MEMORY_REPO_PAT }}", path: memory_data}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - env: {AION_MEMORY_ROOT: memory_data}
        run: python tools/run_scientific_discovery.py
      - uses: ./.github/actions/commit-and-push
        with:
          paths: "-A"
          message: "AION scientific discovery protocol"
          cwd: memory_data
