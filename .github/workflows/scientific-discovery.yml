name: AION - Scientific Discovery Lab
on:
  schedule: [{cron: "40 1 * * *"}]
  workflow_dispatch: {}
permissions: {contents: read}
jobs:
  design-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: pongsatornm1991-droid/aion-memory-data, token: "${{ secrets.MEMORY_REPO_PAT }}", path: memory_data}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - env: {AION_MEMORY_ROOT: memory_data}
        run: python tools/run_scientific_discovery.py
      - working-directory: memory_data
        run: |
          git config user.name aion-bot
          git config user.email aion-bot@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then git commit -m "AION scientific discovery protocol"; git push; fi
