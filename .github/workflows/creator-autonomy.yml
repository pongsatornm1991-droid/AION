name: AION - Creator intention cycle

on:
  schedule:
    # First step of the six-hour creative planning sequence.
    - cron: "5 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: aion-memory-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  choose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pongsatornm1991-droid/aion-memory-data
          token: ${{ secrets.MEMORY_REPO_PAT }}
          path: memory_data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Let AION choose one creative intention
        env:
          AION_MEMORY_ROOT: memory_data
        run: python tools/run_creator_autonomy.py
      - name: Persist AION's private intention
        uses: ./.github/actions/commit-and-push
        with:
          paths: "-A"
          message: "AION creator intention ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          cwd: memory_data
