name: AION - Render Creator episode

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  render-story:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install episode renderer
        run: |
          # GitHub's Ubuntu image already contains ffmpeg.  Avoid an
          # unnecessary apt update here: it can stall before a story starts.
          ffmpeg -version
          pip install -r requirements.txt
      - name: Render AION Creator episode
        env:
          REEL_VOICE_PROVIDER: ${{ vars.REEL_VOICE_PROVIDER || 'edge-tts' }}
          REEL_VOICE: ${{ vars.REEL_VOICE || 'en-US-AvaMultilingualNeural' }}
        run: python tools/render_story_episode.py
      - name: Commit rendered episode
        run: |
          git config user.name "aion-bot"
          git config user.email "aion-bot@users.noreply.github.com"
          git add content/reels/
          if ! git diff --cached --quiet; then
            git commit -m "AION: render Creator episode 001"
            git push
          fi
