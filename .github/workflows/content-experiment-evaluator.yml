name: AION - content experiment evaluator
on:
  schedule:
    - cron: "40 */6 * * *"
  workflow_dispatch: {}
concurrency:
  # This workflow writes the same private memory repository as publishing,
  # research and learning.  It must share their writer lane to avoid a git
  # race that could lose an attribution or experiment result.
  group: aion-memory-data
  cancel-in-progress: false
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: pongsatornm1991-droid/aion-memory-data, token: "${{ secrets.MEMORY_REPO_PAT }}", path: memory_data}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - env: {AION_MEMORY_ROOT: memory_data}
        run: python tools/run_content_experiment_evaluator.py
      - env: {AION_MEMORY_ROOT: memory_data}
        run: python tools/run_growth_to_studio.py
      - working-directory: memory_data
        run: |
          git config user.name aion-bot
          git config user.email aion-bot@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then git commit -m "AION content experiment result"; git push; fi
