name: AION - reflection cycle

# Runs run-reflection-cycle -- the piece that actually originates a
# NEW curiosity question from AION's own real, recorded experience
# (comment replies, external knowledge, lessons), rather than only
# ever consuming a question that already exists (which is all
# social-cycle.yml and learning-cycle.yml ever did before this
# workflow existed). Added 2026-08-31 after the user noticed both of
# those repeatedly reporting "nothing to draft from" / "nothing to
# research" every single hourly run -- see brain/reflection.py's
# module docstring for the full root-cause explanation.
#
# Runs hourly so a new deployment with empty memory quickly receives
# its single owner-defined bootstrap growth goal. It remains self-limiting:
# a checkpoint prevents reconsidering old material, and bounded question/
# goal trackers prevent unbounded origination.
#
# Shares the same private memory_data repo as the other cycles (see
# social-cycle.yml's header comment for why memory/ is not tracked in
# this public repo).

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

# All AION workflows share one private, git-backed memory_data repo
# with no locking of its own: two runs (any mix of these 7 workflows)
# executing at the same time each check out their own independent
# snapshot, so both can see the same "proposed" action or unread
# Telegram update and act on it a second time before either has
# pushed. This is exactly what happened on 2026-08-31: overlapping
# runs of check-profile-approvals.yml each approved+executed the same
# pending bio-change proposal, burning the whole day's IDENTITY_CHANGE
# budget on one real approval tap. A single concurrency group across
# all 7 workflows serializes every run that touches memory_data --
# cancel-in-progress:false queues a run instead of racing it, since
# these are cheap idempotent polls where waiting a few seconds costs
# nothing.
concurrency:
  group: aion-memory-data
  cancel-in-progress: false

jobs:
  reflection-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AION code
        uses: actions/checkout@v4

      - name: Checkout AION memory (private repo)
        uses: actions/checkout@v4
        with:
          repository: pongsatornm1991-droid/aion-memory-data
          token: ${{ secrets.MEMORY_REPO_PAT }}
          path: memory_data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run run-reflection-cycle
        env:
          AION_MEMORY_ROOT: memory_data
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py run-reflection-cycle

      - name: Persist memory changes back to the private repo
        working-directory: memory_data
        run: |
          git config user.name "aion-bot"
          git config user.email "aion-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No memory changes this run -- nothing to commit."
          else
            git commit -m "AION memory update ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
