name: AION - Research to story brief

on:
  schedule:
    # Follows the reference study so new creator lessons are available to the
    # Story Agent without starting both memory writers at once.
    - cron: "55 */3 * * *"
  # Do not leave a newly qualified evidence record waiting for the next
  # three-hour sweep.  This is a planning-only handoff; image generation and
  # publication retain their separate bounded workflows.
  workflow_run:
    workflows: [AION - external learning cycle]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: aion-memory-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pongsatornm1991-droid/aion-memory-data
          token: ${{ secrets.MEMORY_REPO_PAT }}
          path: memory_data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the story-planning runtime
        # stage_creator_episode imports the provider factory from main.py,
        # which loads dotenv.  Installing the declared runtime here prevents
        # a healthy research brief from dying at the handoff boundary.
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Prepare one evidence-grounded story brief
        env:
          AION_MEMORY_ROOT: memory_data
        run: python tools/run_research_to_story.py
      - name: Hand the qualified brief to the Story Agent
        env:
          AION_MEMORY_ROOT: memory_data
        run: python tools/run_research_story_handoff.py
      - name: Stage one evidence-grounded storyboard for AION Studio
        env:
          AION_MEMORY_ROOT: memory_data
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}
        run: python tools/stage_creator_episode.py
      - name: Persist the private brief
        working-directory: memory_data
        run: |
          git config user.name "aion-bot"
          git config user.email "aion-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "AION research story brief ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
      - name: Persist the Studio storyboard
        run: |
          git config user.name "aion-bot"
          git config user.email "aion-bot@users.noreply.github.com"
          git add content/creator_series/
          if ! git diff --cached --quiet; then
            git commit -m "AION: stage research-grounded storyboard"
            git pull --rebase origin main
            git push
          fi
