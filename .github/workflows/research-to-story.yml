name: AION - Research to story brief

on:
  schedule:
    # Follows the reference study so new creator lessons are available to the
    # Story Agent without starting both memory writers at once.
    - cron: "55 */3 * * *"
  workflow_dispatch: {}

concurrency:
  group: aion-memory-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pongsatornm1991-droid/aion-memory-data
          token: ${{ secrets.MEMORY_REPO_PAT }}
          path: memory_data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare one evidence-grounded story brief
        env:
          AION_MEMORY_ROOT: memory_data
        run: python tools/run_research_to_story.py
      - name: Hand the qualified brief to the Story Agent
        env:
          AION_MEMORY_ROOT: memory_data
        run: python tools/run_research_story_handoff.py
      - name: Stage one evidence-grounded storyboard for AION Studio
        env:
          AION_MEMORY_ROOT: memory_data
        run: python tools/stage_creator_episode.py
      - name: Stage the matching primary-episode storyboard when weekly work begins
        # Saturday's primary episode is planned on Monday, alongside the
        # three distinct Shorts for Thursday/Friday/Sunday. This only writes a storyboard from
        # cited evidence; image generation remains in the bounded Studio shift.
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '55 */3 * * *' }}
        env:
          AION_MEMORY_ROOT: memory_data
        run: |
          if [[ "$(date -u +%u)" == "1" ]]; then
            python tools/stage_creator_episode.py --format long-form
          else
            echo "Primary storyboard is scheduled for Monday's planning shift."
          fi
      - name: Persist the private brief
        working-directory: memory_data
        run: |
          git config user.name "aion-bot"
          git config user.email "aion-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "AION research story brief ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
      - name: Persist the Studio storyboard
        run: |
          git config user.name "aion-bot"
          git config user.email "aion-bot@users.noreply.github.com"
          git add content/creator_series/
          if ! git diff --cached --quiet; then
            git commit -m "AION: stage research-grounded storyboard"
            git pull --rebase origin main
            git push
          fi
