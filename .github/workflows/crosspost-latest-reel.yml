name: AION - cross-post latest Reel to Facebook
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  # This workflow mutates the same private memory repo as the other
  # cognitive/publishing cycles. Queue rather than race a checkpoint.
  group: aion-memory-data
  cancel-in-progress: false
jobs:
  crosspost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pongsatornm1991-droid/aion-memory-data
          token: ${{ secrets.MEMORY_REPO_PAT }}
          path: memory_data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Publish Facebook Reel
        env:
          AION_MEMORY_ROOT: memory_data
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py run-reel-crosspost
      - name: Persist private memory
        uses: ./.github/actions/commit-and-push
        with:
          paths: "-A"
          message: "AION Facebook Reel cross-post"
          cwd: memory_data
